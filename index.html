<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的工具导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .menu {
            display: grid;
            gap: 15px;
        }
        .menu-btn {
            display: block;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>我的工具集合</h1>
        <div class="menu">
            <!-- 下面这些按钮，你只需要修改 href 和文字就能用 -->
            <a href="jisuan.html" class="menu-btn">游戏成本计算器</a>
            <a href="gongju.html" class="menu-btn">实用工具1</a>
            <a href="biji.html" class="menu-btn">笔记/备忘录</a>
            <a href="tool2.html" class="menu-btn">其他工具</a>
        </div>
    </div>
</body>
</html>
