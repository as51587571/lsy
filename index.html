        function handleItemDragStart(e) { draggedItemCell = this; this.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/html', this.innerHTML); }
        function handleItemDragEnd(e) { this.classList.remove('dragging'); document.querySelectorAll('.item-cell').forEach(cell => cell.classList.remove('drag-over')); }
        function handleItemDragOver(e) { if (e.preventDefault) e.preventDefault(); e.dataTransfer.dropEffect = 'move'; return false; }
        function handleItemDragEnter(e) { if (draggedItemCell !== this) this.classList.add('drag-over'); }
        function handleItemDragLeave(e) { this.classList.remove('drag-over'); }
        function handleItemDrop(e) {
            if (e.stopPropagation) e.stopPropagation();
            if (draggedItemCell !== this) {
                const draggedIndex = parseInt(draggedItemCell.dataset.itemIndex);
                const targetIndex = parseInt(this.dataset.itemIndex);
                const items = recipes[currentProfession];
                const draggedItem = items[draggedIndex];
                const targetItem = items[targetIndex];
                items[draggedIndex] = targetItem;
                items[targetIndex] = draggedItem;
                loadProfessionItems();
                showNotification(`已交换 ${draggedItem.name} 和 ${targetItem.name} 的位置`, 'success');
            }
            return false;
        }

        function flattenGrid() {
            const flat = [];
            for (const row of materialGrid) for (const item of row) flat.push(item);
            return flat;
        }

        function writeFlatToGrid(flat) {
            const grid = [];
            for (let i = 0; i < flat.length; i += 3) {
                const row = [flat[i] ?? null];
                if (i + 1 < flat.length) row.push(flat[i + 1] ?? null); else row.push(null);
                if (i + 2 < flat.length) row.push(flat[i + 2] ?? null); else row.push(null);
                grid.push(row);
            }
            setMaterialGrid(grid);
            const map = {};
            flat.forEach(item => { if (item) map[item.name] = { price: item.price }; });
            setMaterials(map);
        }

        function loadMaterialsTable() {
            const panelTitle = document.getElementById("materialsPanelTitle");
            if (panelTitle) panelTitle.textContent = `📚 ${currentProfession} · 材料库`;
            const container = document.getElementById("materialsGrid");
            container.innerHTML = "";
            const flat = flattenGrid();
            while (flat.length % 3 !== 0) flat.push(null);
            flat.forEach((material, index) => {
                const card = document.createElement("div");
                card.dataset.flatIndex = index;
                if (material) {
                    const mName = material.name;
                    const mColor = material.color || '#ffffff'; // 默认为白色
                    card.className = 'material-card';
                    card.draggable = true;
                    card.dataset.materialName = mName;
                    card.title = `右键菜单:修改名称/颜色`;
                    card.innerHTML = `<input type="checkbox" class="material-batch-checkbox" data-material-index="${index}" onclick="toggleMaterialSelection(this, ${index})"><div class="material-content"><span class="material-name" style="color:${mColor};">${mName}</span><span class="material-price editable-price" data-name="${mName}" title="点击直接修改价格">💰 ${material.price.toLocaleString()}</span></div>`;
                    card.addEventListener('click', (e) => {
                        // 双击价格编辑不受影响
                        if (e.detail >= 2 && e.target.classList.contains('editable-price')) return;
                        
                        if (materialBatchMode) {
                            // 批量模式下，点击任意位置切换选择
                            const checkbox = card.querySelector('.material-batch-checkbox');
                            checkbox.checked = !checkbox.checked;
                            toggleMaterialSelection(checkbox, index);
                        } else {
                            addToQueue(mName, 1);
                            selectMaterialByName(mName, material);
                        }
                    });
                    card.querySelector('.material-name').addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (!materialBatchMode) {
                            addToQueue(mName, 1);
                            selectMaterialByName(mName, material);
                        }
                    });
                    // 点击💰价格直接内联编辑
                    card.querySelector('.editable-price').addEventListener('click', (e) => { 
                        e.stopPropagation(); 
                        makePriceInlineEditable(e.currentTarget, mName); 
                    });
                    // 添加右键菜单
                    card.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        showMaterialContextMenu(e.clientX, e.clientY, mName, material);
                    });
                    card.addEventListener('dragstart', handleMaterialDragStart);
                    card.addEventListener('dragend', handleMaterialDragEnd);
                } else {
                    card.className = 'material-card empty-card';
                    card.draggable = false;
                    card.dataset.isEmpty = 'true';
                }
                card.addEventListener('dragover', handleMaterialDragOver);
                card.addEventListener('drop', handleMaterialDrop);
                card.addEventListener('dragenter', handleMaterialDragEnter);
                card.addEventListener('dragleave', handleMaterialDragLeave);
                container.appendChild(card);
            });
            if (selectedItem) highlightRequiredMaterials(selectedItem);
        }

        // ✅ 修复：删除材料时只检查当前职业的物品是否使用
        function quickDeleteMaterial(name) {
            const usedBy = [];
            const items = recipes[currentProfession] || [];
            for (const item of items) {
                if (item.materials && item.materials[name]) usedBy.push(item.name);
            }
            if (usedBy.length > 0) {
                showNotification(`无法删除，${name} 被当前职业物品使用: ${usedBy.join(', ')}`, 'error');
                return;
            }
            const flat = flattenGrid();
            const idx = flat.findIndex(m => m && m.name === name);
            if (idx >= 0) flat[idx] = null;
            writeFlatToGrid(flat);
            loadMaterialsTable();
            if (selectedItem && selectedItem.materials && selectedItem.materials[name]) {
                delete selectedItem.materials[name];
                displayItemDetails(selectedItem);
            }
            showNotification(`材料 ${name} 已删除`, 'success');
            autoSave();
        }

        function selectMaterialByName(name, material) {
            document.getElementById("materialName").value = name;
            document.getElementById("materialPrice").value = material.price;
            document.getElementById("itemMaterialName").value = name;
            selectedMaterial = name;
        }

        let draggedMaterialCard = null;

        function showMaterialContextMenu(x, y, materialName, material) {

                const colorItem = document.createElement('div');

                colorItem.onclick = () => setMaterialColor(materialName, color.value);

        // 设置材料颜色
        function setMaterialColor(materialName, color) {
            const flat = flattenGrid();
            const idx = flat.findIndex(m => m && m.name === materialName);
            if (idx >= 0 && flat[idx]) {
                flat[idx].color = color;
                writeFlatToGrid(flat);
                loadMaterialsTable();
                autoSave();
                showNotification(`材料颜色已更新`, 'success');
            }
            hideContextMenu();
        }
        
        // 从右键菜单修改材料价格
        function editMaterialPriceFromMenu(materialName, currentPrice) {
            hideContextMenu();
            const newPrice = prompt(`修改材料「${materialName}」的价格:\n当前价格: ${currentPrice.toLocaleString()}`, currentPrice);
            if (newPrice === null) return; // 用户取消
            
            const price = parseInt(newPrice);
            if (isNaN(price) || price < 0) {
                showNotification('请输入有效的价格', 'error');
                return;
            }
            
            const flat = flattenGrid();
            flat.forEach(item => { if (item && item.name === materialName) item.price = price; });
            writeFlatToGrid(flat);
            loadMaterialsTable();
            loadProfessionItems();
            if (selectedItem) { displayItemDetails(selectedItem); highlightRequiredMaterials(selectedItem); }
            showNotification(`材料 ${materialName} 价格已更新为 ${price.toLocaleString()}`, 'success');
            autoSave();
        }
        
        // 从右键菜单修改材料名称
        function editMaterialNameFromMenu(oldName) {
            hideContextMenu();
            const newName = prompt(`修改材料名称:\n当前名称: ${oldName}`, oldName);
            if (newName === null || !newName.trim()) return;
            const trimmedName = newName.trim();
            
            // 如果名称没变,直接返回
            if (trimmedName === oldName) {
                showNotification('名称未变化', 'info');
                return;
            }
            
            // 检查是否重名
            const flat = flattenGrid();
            if (flat.some(m => m && m.name === trimmedName && m.name !== oldName)) {
                showNotification(`当前职业材料库中已存在同名材料「${trimmedName}」`, 'error');
                return;
            }
            
            // 更新材料名称
            flat.forEach(item => { 
                if (item && item.name === oldName) item.name = trimmedName; 
            });
            writeFlatToGrid(flat);
            
            // 更新所有使用该材料的物品
            const items = recipes[currentProfession] || [];
            let updatedItemCount = 0;
            items.forEach(item => {
                if (item.materials && item.materials[oldName]) {
                    item.materials[trimmedName] = item.materials[oldName];
                    delete item.materials[oldName];
                    updatedItemCount++;
                }
            });
            
            // 刷新界面
            loadMaterialsTable();
            loadProfessionItems();
            
            // 如果当前选中的物品使用了该材料,重新显示详情
            if (selectedItem && selectedItem.materials && (selectedItem.materials[trimmedName] || selectedItem.materials[oldName])) {
                const itemIndex = recipes[currentProfession].findIndex(i => i.name === selectedItem.name);
                if (itemIndex >= 0) {
                    selectedItem = recipes[currentProfession][itemIndex];
                    displayItemDetails(selectedItem);
                    highlightRequiredMaterials(selectedItem);
                }
            }
            
            if (updatedItemCount > 0) {
                showNotification(`✅ 材料名称已更新: 「${oldName}」→「${trimmedName}」\n已自动更新 ${updatedItemCount} 个物品`, 'success');
            } else {
                showNotification(`✅ 材料名称已更新: 「${oldName}」→「${trimmedName}」`, 'success');
            }
            autoSave();
        }
        
        // 隐藏右键菜单
        function hideContextMenu() {
            document.getElementById('contextMenu').style.display = 'none';
        }
        
        // 点击其他地方关闭菜单
        document.addEventListener('click', hideContextMenu);
        document.addEventListener('contextmenu', (e) => {
            if (!e.target.closest('.context-menu')) {
                hideContextMenu();
            }
        });
        
        function handleMaterialDragStart(e) { draggedMaterialCard = this; this.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', this.dataset.flatIndex); }
        function handleMaterialDragEnd(e) { this.classList.remove('dragging'); document.querySelectorAll('.material-card').forEach(c => c.classList.remove('drag-over')); draggedMaterialCard = null; }
        function handleMaterialDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; return false; }
        function handleMaterialDragEnter(e) { if (draggedMaterialCard !== this) this.classList.add('drag-over'); }
        function handleMaterialDragLeave(e) { this.classList.remove('drag-over'); }
        function handleMaterialDrop(e) {
            e.stopPropagation(); e.preventDefault();
            if (!draggedMaterialCard || draggedMaterialCard === this) return false;
            const fromIdx = parseInt(draggedMaterialCard.dataset.flatIndex);
            const toIdx = parseInt(this.dataset.flatIndex);
            if (isNaN(fromIdx) || isNaN(toIdx) || fromIdx === toIdx) return false;
            const flat = flattenGrid();
            while (flat.length % 3 !== 0) flat.push(null);
            const fromMat = flat[fromIdx];
            const toMat = flat[toIdx];
            if (toMat === null) { flat[toIdx] = fromMat; flat[fromIdx] = null; }
            else { flat[fromIdx] = toMat; flat[toIdx] = fromMat; }
            writeFlatToGrid(flat);
            loadMaterialsTable();
            autoSave();
            return false;
        }

        function makeItemNameEditable(nameSpan, item) {
            const currentName = nameSpan.textContent;
            
            // 创建输入框
            const input = document.createElement('input');
            input.type = 'text';
            input.value = currentName;
            input.style.cssText = 'background: rgba(0,0,0,0.5); border: 1px solid #4a9eff; color: #4a9eff; padding: 4px 8px; border-radius: 4px; font-size: 1.1em; font-weight: 600; width: 100%; outline: none;';
            
            // 替换span为input
            nameSpan.replaceWith(input);
            
            // 使用 setTimeout 确保 DOM 更新后再聚焦和选中
            setTimeout(() => {
                input.focus();
                input.select();
            }, 10);
            
            // 保存函数
            const saveName = function() {
                const newName = input.value.trim();
                if (newName && newName !== currentName) {
                    // 更新物品名称
                    const oldName = item.name;
                    item.name = newName;
                    
                    // 更新 recipes 数组中的引用
                    const itemIndex = recipes[currentProfession].findIndex(i => i.name === oldName);
                    if (itemIndex >= 0) {
                        recipes[currentProfession][itemIndex].name = newName;
                    }
                    
                    autoSave();
                    showNotification(`物品名称已更新为 "${newName}"`, 'success');
                    
                    // 重新加载左侧列表
                    loadProfessionItems();
                    
                    // 重新选中该物品
                    setTimeout(() => {
                        const cells = document.querySelectorAll('.item-cell');
                        cells.forEach(cell => {
                            const cellItem = recipes[currentProfession][parseInt(cell.dataset.itemIndex)];
                            if (cellItem && cellItem.name === newName) {
                                selectItem(cellItem, cell);
                            }
                        });
                    }, 10);
                } else if (!newName) {
                    // 如果名称为空，恢复原名称
                    input.value = currentName;
                }
            };
            
            // 失去焦点时保存
            input.addEventListener('blur', saveName);
            
            // 按键处理
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    this.blur();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    this.value = currentName;
                    this.blur();
                }
            });
        }
        
        function calculateItemCost(item) {
            let totalCost = 0;
            for (const [materialName, quantity] of Object.entries(item.materials)) {
                const material = materials[materialName];
                if (material) totalCost += material.price * quantity;
            }
            return totalCost;
        }

        function selectItem(item, row) {
            document.querySelectorAll("#itemsTableBody tr").forEach(r => r.classList.remove("selected"));
            row.classList.add("selected");
            selectedItem = item;
            // 保存物品的索引
            selectedItemIndex = recipes[currentProfession].indexOf(item);
            displayItemDetails(item);
            highlightRequiredMaterials(item);
            highlightSelectedItemCell(item);
            
            // 显示取消选择按钮
            document.getElementById("clearSelectionBtn").style.display = "inline-block";
        }

        function highlightRequiredMaterials(item) {
            document.querySelectorAll('.material-card').forEach(c => c.classList.remove('highlighted-card'));
            if (!item || !item.materials) return;
            const needed = new Set(Object.keys(item.materials));
            document.querySelectorAll('.material-card[data-material-name]').forEach(card => { if (needed.has(card.dataset.materialName)) card.classList.add('highlighted-card'); });
        }

        // 高亮选中的物品单元格
        function highlightSelectedItemCell(item) {
            // 先清除所有物品单元格的高亮
            document.querySelectorAll('.item-cell').forEach(c => c.classList.remove('highlighted-cell'));
            
            if (!item) return;
            
            // 找到对应的物品单元格并添加高亮
            const cells = document.querySelectorAll('.item-cell');
            cells.forEach(cell => {
                const itemIndex = parseInt(cell.dataset.itemIndex);
                if (!isNaN(itemIndex) && recipes[currentProfession][itemIndex] === item) {
                    cell.classList.add('highlighted-cell');
                }
            });
        }

        function updateItemCategory(newCat) {
            if (!selectedItem) return;
            const cat = newCat.trim();
            if (!cat) return;
            selectedItem.category = cat;
            initProfessionCategories(currentProfession);
            const cats = professionCategories[currentProfession];
            if (!cats.includes(cat)) cats.push(cat);
            renderCategoryTabs();
            loadProfessionItems();
            autoSave();
            showNotification(`分类已更新为「${cat}」`, 'success');
        }

        function displayItemDetails(item) {

            const itemColor = item.color || '#4a9eff';

            itemNameEl.onclick = function(e) {
                e.stopPropagation();
                e.preventDefault();
                
                const currentName = this.textContent;
                
                // 创建输入框
                const input = document.createElement('input');
                input.type = 'text';
                input.value = currentName;
                input.style.cssText = 'background: rgba(0,0,0,0.5); border: 1px solid #4a9eff; color: #4a9eff; padding: 4px 8px; border-radius: 4px; font-size: 1.1em; font-weight: 600; width: 100%; outline: none;';
                
                // 清空并添加输入框
                this.textContent = '';
                this.appendChild(input);
                
                // 使用 setTimeout 确保 DOM 更新后再聚焦和选中
                setTimeout(() => {
                    input.focus();
                    input.select();
                }, 10);
                
                // 保存函数
                const saveName = function() {
                    const newName = input.value.trim();
                    if (newName && newName !== currentName) {
                        // 使用索引更新物品名称
                        if (selectedItemIndex >= 0 && selectedItemIndex < recipes[currentProfession].length) {
                            recipes[currentProfession][selectedItemIndex].name = newName;
                        }
                        
                        autoSave();
                        showNotification(`物品名称已更新为 "${newName}"`, 'success');
                        
                        // 重新加载左侧列表
                        loadProfessionItems();
                        
                        // 重新选中该物品
                        setTimeout(() => {
                            const cells = document.querySelectorAll('.item-cell');
                            cells.forEach(cell => {
                                if (parseInt(cell.dataset.itemIndex) === selectedItemIndex) {
                                    const cellItem = recipes[currentProfession][selectedItemIndex];
                                    selectItem(cellItem, cell);
                                }
                            });
                        }, 10);
                    } else if (!newName) {
                        // 如果名称为空，恢复原名称
                        input.value = currentName;
                    }
                    // 恢复为文本显示
                    itemNameEl.textContent = newName || currentName;
                    itemNameEl.style.cursor = 'pointer';
                    itemNameEl.style.color = '#4a9eff';
                    itemNameEl.title = '单击修改名称';
                };
                
                // 失去焦点时保存

            input.type = 'number';
            input.value = currentPrice;
            input.style.cssText = 'background: rgba(255,255,255,0.25); border: 2px solid #ffa500; color: #ffcc00; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; width: 80px; font-weight: bold; outline: none;';
            
            const saveEdit = () => {
                const newPrice = parseInt(input.value);
                if (!isNaN(newPrice) && newPrice >= 0 && newPrice !== currentPrice) {
                    // 更新价格
                    const flat = flattenGrid();
                    flat.forEach(item => { if (item && item.name === materialName) item.price = newPrice; });
                    writeFlatToGrid(flat);
                    
                    // 刷新显示
                    loadMaterialsTable();
                    loadProfessionItems();
                    if (selectedItem) { displayItemDetails(selectedItem); highlightRequiredMaterials(selectedItem); }
                    
                    showNotification(`💰 ${materialName}: ${currentPrice.toLocaleString()} → ${newPrice.toLocaleString()}`, 'success');
                    autoSave();
                } else if (newPrice === currentPrice) {
                    // 没有修改,恢复显示
                    loadMaterialsTable();
                }
            };
            
            input.addEventListener('blur', saveEdit);
            input.addEventListener('keypress', (e) => { 
                if (e.key === 'Enter') {
                    input.blur(); // 触发blur事件保存
                }
                if (e.key === 'Escape') {
                    loadMaterialsTable(); // 取消编辑
                }
            });
            
            // 替换内容为输入框
            priceSpan.innerHTML = '';
            priceSpan.appendChild(input);
            input.focus();
            input.select(); // 全选方便直接输入
        }

        // 保存成本和收益计算的输入框值
        function saveCalculationInputs() {
            const inputs = {
                craftQuantity: document.getElementById('craftQuantity').value,
                sellPrice: document.getElementById('sellPrice').value,
                successCount: document.getElementById('successCount').value
            };
            localStorage.setItem('calculationInputs', JSON.stringify(inputs));
        }

        // 加载成本和收益计算的输入框值
        function loadCalculationInputs() {
            const saved = localStorage.getItem('calculationInputs');
            if (saved) {
                try {
                    const inputs = JSON.parse(saved);
                    if (inputs.craftQuantity !== undefined) {
                        document.getElementById('craftQuantity').value = inputs.craftQuantity;
                    }
                    if (inputs.sellPrice !== undefined) {
                        document.getElementById('sellPrice').value = inputs.sellPrice;
                    }
                    if (inputs.successCount !== undefined) {
                        document.getElementById('successCount').value = inputs.successCount;
                    }
                } catch (e) {
                    console.error('加载计算输入框数据失败:', e);
                }
            }
        }

        // 为计算输入框添加自动保存事件监听
        function setupCalculationInputListeners() {
            const craftQuantity = document.getElementById('craftQuantity');
            const sellPrice = document.getElementById('sellPrice');
            const successCount = document.getElementById('successCount');
            
            if (craftQuantity) {
                craftQuantity.addEventListener('input', saveCalculationInputs);
                craftQuantity.addEventListener('change', saveCalculationInputs);
            }
            if (sellPrice) {
                sellPrice.addEventListener('input', saveCalculationInputs);
                sellPrice.addEventListener('change', saveCalculationInputs);
            }
            if (successCount) {
                successCount.addEventListener('input', saveCalculationInputs);
                successCount.addEventListener('change', saveCalculationInputs);
            }
        }

        // 批量选择相关变量
        let batchMode = false;
        let selectedItems = new Set();

        // 切换批量模式
        function toggleBatchMode() {
            batchMode = !batchMode;
            const itemsPanel = document.getElementById('itemsPanel');
            const selectAllBtn = document.getElementById('selectAllBtn');
            const batchDeleteBtn = document.getElementById('batchDeleteBtn');
            const batchModeBtn = document.getElementById('batchModeBtn');
            
            if (batchMode) {
                itemsPanel.classList.add('batch-mode');
                selectAllBtn.style.display = 'inline-block';
                batchDeleteBtn.style.display = 'inline-block';
                batchModeBtn.textContent = '退出批量';
                batchModeBtn.className = 'btn btn-warning';
            } else {
                itemsPanel.classList.remove('batch-mode');
                selectAllBtn.style.display = 'none';
                batchDeleteBtn.style.display = 'none';
                batchModeBtn.textContent = '批量模式';
                batchModeBtn.className = 'btn btn-secondary';
                // 清空选择
                selectedItems.clear();
                updateSelectedCount();
                document.querySelectorAll('.batch-checkbox').forEach(cb => cb.checked = false);
                document.querySelectorAll('.item-cell').forEach(cell => cell.classList.remove('batch-selected'));
            }
        }

        // 切换物品选择
        function toggleItemSelection(checkbox, itemIndex) {
            if (checkbox.checked) {
                selectedItems.add(itemIndex);
                checkbox.closest('.item-cell').classList.add('batch-selected');
            } else {
                selectedItems.delete(itemIndex);
                checkbox.closest('.item-cell').classList.remove('batch-selected');
            }
            updateSelectedCount();
        }

        // 全选/取消全选
        function toggleSelectAll() {
            const checkboxes = document.querySelectorAll('.batch-checkbox');
            const selectAllBtn = document.getElementById('selectAllBtn');
            
            if (selectedItems.size === checkboxes.length) {
                // 取消全选
                selectedItems.clear();
                checkboxes.forEach(cb => {
                    cb.checked = false;
                    cb.closest('.item-cell').classList.remove('batch-selected');
                });
                selectAllBtn.textContent = '全选';
            } else {
                // 全选
                selectedItems.clear();
                checkboxes.forEach(cb => {
                    cb.checked = true;
                    const index = parseInt(cb.dataset.itemIndex);
                    selectedItems.add(index);
                    cb.closest('.item-cell').classList.add('batch-selected');
                });
                selectAllBtn.textContent = '取消全选';
            }
            updateSelectedCount();
        }

        // 更新选中数量显示
        function updateSelectedCount() {
            document.getElementById('selectedCount').textContent = selectedItems.size;
        }

        // 批量删除物品
        function batchDeleteItems() {
            if (selectedItems.size === 0) {
                showNotification('请先选择要删除的物品', 'warning');
                return;
            }
            
            if (!confirm(`确定要删除选中的 ${selectedItems.size} 个物品吗？`)) {
                return;
            }
            
            // 按索引从大到小排序，避免删除时索引变化
            const sortedIndices = Array.from(selectedItems).sort((a, b) => b - a);
            
            sortedIndices.forEach(index => {
                if (index >= 0 && index < recipes[currentProfession].length) {
                    recipes[currentProfession].splice(index, 1);
                }
            });
            
            // 清空选择
            selectedItems.clear();
            
            // 重新加载
            autoSave();
            renderCategoryTabs();
            loadProfessionItems();
            
            showNotification(`已删除 ${sortedIndices.length} 个物品`, 'success');
        }

        // 材料批量选择相关变量
        let materialBatchMode = false;
        let selectedMaterials = new Set();

        // 切换材料批量模式
        function toggleMaterialBatchMode() {
            materialBatchMode = !materialBatchMode;
            const materialsGrid = document.getElementById('materialsGrid');
            const selectAllBtn = document.getElementById('materialSelectAllBtn');
            const batchDeleteBtn = document.getElementById('materialBatchDeleteBtn');
            const batchModeBtn = document.getElementById('materialBatchModeBtn');
            
            if (materialBatchMode) {
                materialsGrid.classList.add('batch-mode');
                selectAllBtn.style.display = 'inline-block';
                batchDeleteBtn.style.display = 'inline-block';
                batchModeBtn.textContent = '退出批量';
                batchModeBtn.className = 'btn btn-warning';
            } else {
                materialsGrid.classList.remove('batch-mode');
                selectAllBtn.style.display = 'none';
                batchDeleteBtn.style.display = 'none';
                batchModeBtn.textContent = '批量模式';
                batchModeBtn.className = 'btn btn-info';
                // 清空选择
                selectedMaterials.clear();
                updateMaterialSelectedCount();
                document.querySelectorAll('.material-batch-checkbox').forEach(cb => cb.checked = false);
                document.querySelectorAll('.material-card').forEach(card => card.classList.remove('batch-selected'));
            }
        }

        // 切换材料选择
        function toggleMaterialSelection(checkbox, materialIndex) {
            if (checkbox.checked) {
                selectedMaterials.add(materialIndex);
                checkbox.closest('.material-card').classList.add('batch-selected');
            } else {
                selectedMaterials.delete(materialIndex);
                checkbox.closest('.material-card').classList.remove('batch-selected');
            }
            updateMaterialSelectedCount();
        }

        // 材料全选/取消全选
        function toggleMaterialSelectAll() {
            const checkboxes = document.querySelectorAll('.material-batch-checkbox');
            const selectAllBtn = document.getElementById('materialSelectAllBtn');
            
            if (selectedMaterials.size === checkboxes.length) {
                // 取消全选
                selectedMaterials.clear();
                checkboxes.forEach(cb => {
                    cb.checked = false;
                    cb.closest('.material-card').classList.remove('batch-selected');
                });
                selectAllBtn.textContent = '全选';
            } else {
                // 全选
                selectedMaterials.clear();
                checkboxes.forEach(cb => {
                    cb.checked = true;
                    const index = parseInt(cb.dataset.materialIndex);
                    selectedMaterials.add(index);
                    cb.closest('.material-card').classList.add('batch-selected');
                });
                selectAllBtn.textContent = '取消全选';
            }
            updateMaterialSelectedCount();
        }

        // 更新材料选中数量显示
        function updateMaterialSelectedCount() {
            document.getElementById('materialSelectedCount').textContent = selectedMaterials.size;
        }

        // 批量删除材料
        function batchDeleteMaterials() {
            if (selectedMaterials.size === 0) {
                showNotification('请先选择要删除的材料', 'warning');
                return;
            }
            
            if (!confirm(`确定要删除选中的 ${selectedMaterials.size} 个材料吗？`)) {
                return;
            }
            
            // 按索引从大到小排序，避免删除时索引变化
            const sortedIndices = Array.from(selectedMaterials).sort((a, b) => b - a);
            
            const flat = flattenGrid();
            sortedIndices.forEach(index => {
                if (index >= 0 && index < flat.length) {
                    flat[index] = null;
                }
            });
            
            writeFlatToGrid(flat);
            
            // 清空选择
            selectedMaterials.clear();
            
            // 重新加载
            loadMaterialsTable();
            autoSave();
            
            showNotification(`已删除 ${sortedIndices.length} 个材料`, 'success');
        }
    </script>
</body>
</html>
