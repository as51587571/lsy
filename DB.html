<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏待办事项列表</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        h1 {
            color: #333;
            text-align: center;
            margin: 0;
            font-size: 20px;
            flex: 1;
        }
        .global-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: nowrap;
        }
        .sound-control {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            white-space: nowrap;
        }
        .sound-control button {
            padding: 2px 6px;
            font-size: 10px;
        }
        .date-info {
            color: #666;
            font-size: 9px;
            white-space: nowrap;
        }
        .data-controls {
            display: flex;
            gap: 3px;
        }
        .data-controls button {
            padding: 2px 6px;
            font-size: 10px;
            white-space: nowrap;
        }
        /* 数据管理区域样式 */
        .data-management {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        .data-management-label {
            color: white;
            font-weight: bold;
            font-size: 12px;
            white-space: nowrap;
        }
        .data-management-buttons {
            display: flex;
            gap: 6px;
        }
        .data-management button {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .data-management button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .export-main-btn {
            background-color: #4CAF50;
            color: white;
        }
        .import-main-btn {
            background-color: #FF9800;
            color: white;
        }
        .servers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 8px;
            flex: 1;
            min-height: 0;
        }
        .server-section {
            background-color: white;
            border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .server-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .server-title {
            font-size: 14px;
            font-weight: bold;
        }
        .server-controls {
            display: flex;
            gap: 5px;
        }
        .server-content {
            padding: 8px;
            flex: 1;
            overflow-y: auto;
            overflow-x: visible; /* 允许横向溢出，确保下拉框不被裁剪 */
            display: flex;
            flex-direction: column;
        }
        .task-list {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            align-content: start;
        }
        .task-group {
            grid-column: 1 / -1;
        }
        .task-item:hover {
            background-color: #e8e8e8;
            border-color: #ccc;
        }
        .task-item {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 3px 5px;
            border-radius: 3px;
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            transition: all 0.2s;
            font-size: 11px;
            height: 24px;
        }
        /* 任务分组样式 - 增强视觉区分度 */
        .task-group {
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%); /* 渐变背景 */
            border: 2px solid #667eea; /* 更明显的边框 */
            border-radius: 6px;
            padding: 8px;
            box-shadow: 0 2px 4px rgba(102, 126, 234, 0.15); /* 轻微阴影 */
        }
        .task-group-header {
            font-weight: bold;
            font-size: 13px;
            color: #fff;
            margin-bottom: 6px;
            padding: 5px 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 4px rgba(102, 126, 234, 0.15);
            position: relative;
            overflow: hidden;
        }
        .task-group-header .group-title {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .task-group-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 6px;
        }
        .grouped-task {
            background-color: white;
            border: 1px solid #d0d0d0;
            border-left: 3px solid #667eea; /* 左侧彩色边框 */
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        input[type="checkbox"] {
            transform: scale(0.85);
            margin: 0;
        }
        .task-content {
            flex: 1;
            font-size: 11px;
            min-width: 0;
            white-space: nowrap;
        }
        .task-controls {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }
        .repeat-badge {
            display: inline-block;font-size: 11px;
            padding: 2px 5px;
            border-radius: 6px;
            background-color: #e0e0e0;
        }
        .daily {
            background-color: #bbdefb;
            color: #0d47a1;
        }
        .weekly {
            background-color: #c8e6c9;
            color: #1b5e20;
        }
        .add-task {
            display: flex;
            gap: 5px;
            margin-top: 5px;
            flex-shrink: 0;
            flex-wrap: wrap;
            overflow: visible; /* 确保下拉框不被裁剪 */
        }
        .add-task-row {
            display: contents;
        }
        .add-task-row input[type="text"] {
            flex: 1;
            min-width: 200px;
        }
        /* 任务历史记录下拉框 */
        .task-history-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 1000;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 2px;
        }
        .history-item {
            padding: 6px 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        .history-item:hover {
            background-color: #f5f5f5;
        }
        .history-item:last-child {
            border-bottom: none;
        }
        .history-delete-btn {
            padding: 2px 6px;
            font-size: 10px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            margin-left: 8px;
        }
        .history-delete-btn:hover {
            background-color: #d32f2f;
        }
        .history-clear-all {
            padding: 6px 10px;
            text-align: center;
            color: #666;
            cursor: pointer;
            font-size: 11px;
            border-top: 1px solid #e0e0e0;
            background-color: #fafafa;
        }
        .history-clear-all:hover {
            background-color: #f0f0f0;
            color: #f44336;
        }
        input[type="text"], select, input[type="date"], input[type="datetime-local"] {
            padding: 4px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 11px;
        }
        input[type="date"] {
            width: 150px;
            min-width: 150px;
        }
        input[type="datetime-local"] {
            width: 160px;
            min-width: 160px;
        }
        select {
            min-width: 80px;
            max-width: 150px;
            flex: 1;
        }
        /* 角色选择器 */
        .role-selector {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
            margin-bottom: 3px;
        }
        .role-tag {
            padding: 1px 4px;
            border-radius: 8px;
            font-size: 9px;
            cursor: pointer;
            background-color: #e0e0e0;
            color: #666;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .role-tag.active {
            background-color: #667eea;
            color: white;
        }
        .role-tag:hover {
            opacity: 0.8;
        }
        button {
            padding: 2px 5px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
        .sound-control {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            white-space: nowrap;
        }
        .sound-control button {
            padding: 2px 6px;
            font-size: 10px;
        }
        .date-info {
            color: #666;
            font-size: 9px;
            margin-left: auto; /* 推到右边 */
            white-space: nowrap;
        }
        .delete-btn {
            background-color: #f44336;
            padding: 2px 5px;
            font-size: 9px;
        }
        .delete-btn:hover {
            background-color: #d32f2f;
        }
        /* 颜色选择器下拉列表 */
        .color-picker-dropdown {
            position: absolute;
            bottom: 100%; /* 向上弹出 */
            left: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 99999; /* 提高z-index确保在最上层 */
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-bottom: 5px;
        }
        .color-option {
            width: 24px;
            height: 24px;
            border: 2px solid transparent;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .color-option:hover {
            border-color: #333;
            transform: scale(1.1);
        }
        .color-option.selected {
            border-color: #333;
            box-shadow: 0 0 0 2px white, 0 0 0 4px #333;
        }
        .data-controls {
            display: flex;
            gap: 3px;
            flex-wrap: nowrap;
        }
        .data-controls button {
            padding: 2px 6px;
            font-size: 10px;
            white-space: nowrap;
        }
        .export-btn {
            background-color: #2196F3;
        }
        .export-btn:hover {
            background-color: #1976D2;
        }
        .import-btn {
            background-color: #FF9800;
        }
        .import-btn:hover {
            background-color: #F57C00;
        }
        .clear-btn {
            background-color: #9E9E9E;
        }
        .clear-btn:hover {
            background-color: #757575;
        }
        .add-server-btn {
            background-color: #9C27B0;
        }
        .add-server-btn:hover {
            background-color: #7B1FA2;
        }
        .completed-task {
            text-decoration: line-through !important;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: #fff !important;
        }
        /* 提示信息样式 */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 4px;
            color: white;
            font-size: 13px;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .toast.show {
            opacity: 1;
        }
        .toast.success {
            background-color: #4CAF50;
        }
        .toast.error {
            background-color: #f44336;
        }
        .toast.warning {
            background-color: #FF9800;
        }
        .toast.info {
            background-color: #2196F3;
        }
        /* 声音设置面板 */
        .sound-settings {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 10001;
            min-width: 300px;
        }
        .sound-settings.show {
            display: block;
        }
        .sound-settings-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10000;
        }
        .sound-settings-overlay.show {
            display: block;
        }
        .sound-settings h3 {
            margin: 0 0 15px 0;
            color: #333;
        }
        .sound-settings label {
            display: block;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .sound-settings input[type="range"] {
            width: 100%;
            margin: 5px 0;
        }
        .sound-settings .value-display {
            text-align: right;
            color: #666;
            font-size: 12px;
        }
        .sound-settings button {
            margin-top: 10px;
            width: 100%;
        }
        .close-settings {
            background-color: #9E9E9E;
        }
        /* 输入框弹窗样式 */
        .input-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 10002;
            min-width: 300px;
        }
        .input-modal.show {
            display: block;
        }
        .input-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10001;
        }
        .input-modal-overlay.show {
            display: block;
        }
        .input-modal h3 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 16px;
        }
        .input-modal input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .input-modal input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .input-modal-buttons button {
            padding: 6px 16px;
        }
        .modal-cancel {
            background-color: #9E9E9E;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题和控制栏在同一行 -->
        <div class="header-row">
            <h1>游戏待办事项列表</h1>
            
            <!-- 全局控制区 -->
            <div class="global-controls">
                <div class="sound-control">
                    <label>
                        <input type="checkbox" id="sound-toggle" checked>
                        启用声音提示
                    </label>
                    <button onclick="testSound()">测试声音</button>
                    <button onclick="showSoundSettings()">声音设置</button>
                </div>
                
                <!-- 数据管理区域（导出/导入） -->
                <div class="data-management">
                    <span class="data-management-label">📦 数据管理</span>
                    <div class="data-management-buttons">
                        <button class="export-main-btn" onclick="exportData()">💾 导出数据</button>
                        <button class="import-main-btn" onclick="document.getElementById('import-file').click()">📂 导入数据</button>
                        <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importData(this)">
                    </div>
                </div>
                
                <div class="data-controls">
                    <button class="export-btn" onclick="openExportSettings()">⚙️ 导出设置</button>
                    <button class="clear-btn" onclick="clearAllData()">清空</button>
                    <button class="add-server-btn" onclick="addNewServer()">+ 添加大区</button>
                    <button class="global-add-btn" onclick="showGlobalAddTask()" style="background-color: #9C27B0;">全局添加任务</button>
                    <button class="reset-time-btn" onclick="openResetTimeSettings()" style="background-color: #00897B;">⏰ 刷新时间</button>
                </div>
                
                <div class="date-info">
                    最后更新: <span id="last-updated"></span>
                </div>
            </div>
        </div>
        
        <!-- 大区网格布局 -->
        <div class="servers-grid" id="servers-container"></div>
        
        <!-- 声音设置面板 -->
        <div class="sound-settings-overlay" id="sound-overlay" onclick="hideSoundSettings()"></div>
        <div class="sound-settings" id="sound-settings">
            <h3>声音设置</h3>
            
            <label>
                提示音时长（秒）：
                <input type="range" id="sound-duration" min="0.1" max="3" step="0.1" value="0.5" oninput="updateDurationDisplay()">
                <div class="value-display" id="duration-value">0.5秒</div>
            </label>
            
            <label>
                自定义音频文件（可选）：
                <input type="file" id="custom-sound" accept="audio/*" onchange="loadCustomSound(this)">
            </label>
            
            <button onclick="testCustomSound()">测试当前声音</button>
            <button class="close-settings" onclick="hideSoundSettings()">关闭</button>
        </div>
        
        <!-- 导出设置弹窗 -->
        <div class="sound-settings-overlay" id="exportSettingsModal" onclick="closeExportSettingsModal()"></div>
        <div class="sound-settings" id="exportSettingsDialog" style="max-width: 500px;">
            <h3>⚙️ 导出设置</h3>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; color: #4a9eff; font-weight: bold;">📝 导出文件名前缀：</label>
                <input type="text" id="exportPrefixInput" placeholder="例如：游戏待办备份" 
                       style="width: 100%; padding: 10px; border: 1px solid #4a9eff; border-radius: 6px; 
                              background: rgba(0,0,0,0.5); color: white; font-size: 1em;"
                       value="游戏待办备份">
                <p style="margin-top: 8px; font-size: 0.85em; color: #aaa;">
                    💡 提示：导出文件名将按照 [前缀]_[序号].json 格式生成
                </p>
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; color: #4a9eff; font-weight: bold;">🔢 当前序列号：</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <span id="currentCounterDisplay" style="flex: 1; padding: 10px; background: rgba(0,0,0,0.3); 
                           border: 1px solid #4a9eff; border-radius: 6px; color: #4a9eff; font-size: 1em;
                           text-align: center;">001</span>
                    <button class="btn btn-warning" onclick="resetExportCounter()" 
                            style="padding: 10px 20px; font-size: 0.9em; white-space: nowrap; background: #e67e22; color: white; border: none; border-radius: 6px; cursor: pointer;">
                        🔄 重置为1
                    </button>
                </div>
                <p style="margin-top: 8px; font-size: 0.85em; color: #aaa;">
                    ⚠️ 重置后下次导出将从 001 开始
                </p>
            </div>
            <div style="text-align: center; margin-top: 30px; display: flex; gap: 10px; justify-content: center;">
                <button onclick="closeExportSettingsModal()" style="padding: 10px 30px; font-size: 1em; background: #6b7280; color: white; border: none; border-radius: 6px; cursor: pointer;">
                    取消
                </button>
                <button onclick="saveExportSettings()" style="padding: 10px 30px; font-size: 1em; background: #2c7a4d; color: white; border: none; border-radius: 6px; cursor: pointer;">
                    ✅ 保存设置
                </button>
            </div>
        </div>
        
        <!-- 全局添加任务弹窗 -->
        <div class="sound-settings-overlay" id="global-add-overlay" onclick="hideGlobalAddTask()"></div>
        <div class="sound-settings" id="global-add-dialog" style="max-width: 500px;">
            <h3>全局添加任务（所有大区）</h3>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">任务名称：</label>
                <input type="text" id="global-task-name" placeholder="输入任务名称..." style="width: 100%; padding: 8px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">标签颜色：</label>
                <div id="global-color-picker" style="display: flex; gap: 5px; flex-wrap: wrap;"></div>
                <span style="font-size: 12px; color: #666; display: block; margin-top: 5px;">点击选择角色和日期标签的颜色</span>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 8px; font-weight: bold;">重复类型：(点击选择，可多选)</label>
                <div id="global-repeat-container" style="display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; background-color: #f5f5f5; border-radius: 4px; min-height: 36px;">
                    <!-- 标签将通过JavaScript动态生成 -->
                </div>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">任务日期：</label>
                <input type="datetime-local" id="global-task-date" style="width: 100%; padding: 8px;">
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button onclick="hideGlobalAddTask()" style="background-color: #9E9E9E;">取消</button>
                <button onclick="executeGlobalAddTask()" style="background-color: #9C27B0;">确认添加</button>
            </div>
        </div>
        <!-- 刷新时间设置弹窗 -->
        <div class="sound-settings-overlay" id="reset-time-overlay" onclick="hideResetTimeSettings()"></div>
        <div class="sound-settings" id="reset-time-dialog" style="max-width: 400px;">
            <h3>⏰ 刷新时间设置</h3>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; color: #4a9eff; font-weight: bold;">📅 任务刷新时间：</label>
                <input type="time" id="reset-time-input" style="width: 100%; padding: 10px; border: 1px solid #4a9eff; border-radius: 6px; background: rgba(0,0,0,0.5); color: white; font-size: 1em;">
                <p style="margin-top: 8px; font-size: 0.85em; color: #aaa;">
                    💡 提示：刷新时间仅对<strong style="color:#4a9eff">多重置日任务</strong>生效（默认 22:00）。每日任务与单重置日任务固定按 <strong style="color:#4a9eff">00:00（午夜）</strong>重置。
                </p>
            </div>
            <div style="text-align: center; margin-top: 30px; display: flex; gap: 10px; justify-content: center;">
                <button onclick="hideResetTimeSettings()" style="padding: 10px 30px; font-size: 1em; background: #6b7280; color: white; border: none; border-radius: 6px; cursor: pointer;">
                    取消
                </button>
                <button onclick="saveResetTimeSettings()" style="padding: 10px 30px; font-size: 1em; background: #2c7a4d; color: white; border: none; border-radius: 6px; cursor: pointer;">
                    ✅ 保存设置
                </button>

        </div>
        
        <!-- 通用输入框弹窗 -->
        <div class="input-modal-overlay" id="input-modal-overlay" onclick="closeInputModal()"></div>
        <div class="input-modal" id="input-modal">
            <h3 id="input-modal-title">输入</h3>
            <input type="text" id="input-modal-input" placeholder="请输入...">
            <div class="input-modal-buttons">
                <button class="modal-cancel" onclick="closeInputModal()">取消</button>
                <button id="input-modal-confirm" onclick="confirmInputModal()">确定</button>
            </div>
        </div>
    </div>

    <script>
        // 音频上下文用于播放声音
        let audioContext = null;
        let soundEnabled = true;
        let customAudioBuffer = null; // 自定义音频缓冲区
        let soundDuration = 0.5; // 默认时长0.5秒
        
        // Toast提示函数
        function showToast(message, type = 'info', duration = 2000) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            // 显示动画
            setTimeout(() => toast.classList.add('show'), 10);
            
            // 自动隐藏
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => document.body.removeChild(toast), 300);
            }, duration);
        }
        
        // 初始化音频上下文
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        // 播放提示音
        function playNotificationSound() {
            if (!soundEnabled) return;
            
            initAudio();
            
            // 如果有自定义音频，播放自定义音频
            if (customAudioBuffer) {
                const source = audioContext.createBufferSource();
                source.buffer = customAudioBuffer;
                source.connect(audioContext.destination);
                source.start(0);
            } else {
                // 使用默认的合成声音
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + soundDuration);
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + soundDuration);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + soundDuration);
            }
        }
        
        // 测试声音功能
        function testSound() {
            playNotificationSound();
        }
        
        // 显示声音设置面板
        function showSoundSettings() {
            document.getElementById('sound-settings').classList.add('show');
            document.getElementById('sound-overlay').classList.add('show');
        }
        
        // 隐藏声音设置面板
        function hideSoundSettings() {
            document.getElementById('sound-settings').classList.remove('show');
            document.getElementById('sound-overlay').classList.remove('show');
        }
        
        // 更新时长显示
        function updateDurationDisplay() {
            const durationInput = document.getElementById('sound-duration');
            soundDuration = parseFloat(durationInput.value);
            document.getElementById('duration-value').textContent = soundDuration.toFixed(1) + '秒';
            localStorage.setItem('todoSoundDuration', soundDuration);
        }
        
        // 加载自定义音频文件
        function loadCustomSound(inputElement) {
            const file = inputElement.files[0];
            if (!file) return;
            
            initAudio();
            
            const reader = new FileReader();
            reader.onload = function(e) {
                audioContext.decodeAudioData(e.target.result, function(buffer) {
                    customAudioBuffer = buffer;
                    localStorage.setItem('todoCustomSound', 'true');
                    showToast('自定义音频已加载', 'success');
                }, function(error) {
                    showToast('音频解码失败：' + error.message, 'error');
                });
            };
            reader.readAsArrayBuffer(file);
        }
        
        // 测试自定义声音
        function testCustomSound() {
            playNotificationSound();
        }
        
        // 通用输入框相关函数
        let inputModalCallback = null;
        
        function showInputModal(title, placeholder, callback) {
            document.getElementById('input-modal-title').textContent = title;
            document.getElementById('input-modal-input').placeholder = placeholder;
            document.getElementById('input-modal-input').value = '';
            document.getElementById('input-modal').classList.add('show');
            document.getElementById('input-modal-overlay').classList.add('show');
            inputModalCallback = callback;
            
            // 自动聚焦输入框
            setTimeout(() => {
                document.getElementById('input-modal-input').focus();
            }, 100);
        }
        
        function closeInputModal() {
            document.getElementById('input-modal').classList.remove('show');
            document.getElementById('input-modal-overlay').classList.remove('show');
            inputModalCallback = null;
        }
        
        function confirmInputModal() {
            const value = document.getElementById('input-modal-input').value.trim();
            if (value && inputModalCallback) {
                inputModalCallback(value);
            }
            closeInputModal();
        }
        
        // 回车键确认
        document.addEventListener('DOMContentLoaded', function() {
            const inputModalInput = document.getElementById('input-modal-input');
            if (inputModalInput) {
                inputModalInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        confirmInputModal();
                    }
                });
            }
            
            // 点击导出设置弹窗外部关闭
            const exportModal = document.getElementById('exportSettingsModal');
            if (exportModal) {
                exportModal.addEventListener('click', function(e) {
                    if (e.target === exportModal) {
                        closeExportSettingsModal();
                    }
                });
            }
        });
        
        // 切换声音开关
        document.getElementById('sound-toggle').addEventListener('change', function() {
            soundEnabled = this.checked;
            localStorage.setItem('todoSoundEnabled', soundEnabled);
        });
        
        // 从 localStorage 加载声音设置
        function loadSoundSetting() {
            const savedSetting = localStorage.getItem('todoSoundEnabled');
            if (savedSetting !== null) {
                soundEnabled = savedSetting === 'true';
                document.getElementById('sound-toggle').checked = soundEnabled;
            }
                    
            // 加载时长设置
            const savedDuration = localStorage.getItem('todoSoundDuration');
            if (savedDuration !== null) {
                soundDuration = parseFloat(savedDuration);
                document.getElementById('sound-duration').value = soundDuration;
                document.getElementById('duration-value').textContent = soundDuration.toFixed(1) + '秒';
            }
        }
        
        // 设置当前日期
        function updateDate() {
            document.getElementById('last-updated').textContent = new Date().toLocaleDateString('zh-CN');
        }
        updateDate();
        
        // 加载声音设置
        loadSoundSetting();
        
        // 存储任务的数组
        let servers = JSON.parse(localStorage.getItem('gameTodoServers')) || [
            {
                id: 'server-1',
                name: '默认大区',
                tasks: [],
                collapsed: false,
                roles: ['全部'] // 默认角色列表
            }
        ];
        
        // 数据兼容处理：为旧数据添加roles字段
        servers.forEach(server => {
            if (!server.roles || !Array.isArray(server.roles)) {
                server.roles = ['全部'];
            }
            
            // 为旧任务添加role字段
            server.tasks.forEach(task => {
                if (!task.role) {
                    task.role = '全部';
                }
            });
        });
        
        // 保存更新后的数据结构
        saveServers();
        
        // 当前选中的大区ID
        let currentServerId = servers.length > 0 ? servers[0].id : null;
        
        // 防止重复添加的标志
        let isAddingTask = false;
        
        // 当前选中的角色（每个大区独立）
        let currentRoles = {};
        
        // 渲染所有大区
        function renderServers() {
            const container = document.getElementById('servers-container');
            container.innerHTML = '';
            
            servers.forEach(server => {
                const serverElement = createServerElement(server);
                container.appendChild(serverElement);
            });
        }
        
        // 创建大区元素
        function createServerElement(server) {
            const section = document.createElement('div');
            section.className = 'server-section';
            section.dataset.serverId = server.id;
            
            // 大区头部
            const header = document.createElement('div');
            header.className = 'server-header';
            
            const title = document.createElement('div');
            title.className = 'server-title';
            title.textContent = server.name;
            title.title = '双击编辑名称';
            title.style.cursor = 'pointer';
            
            // 双击编辑大区名称
            title.ondblclick = (e) => {
                e.stopPropagation();
                editServerName(server.id, title);
            };
            
            const controls = document.createElement('div');
            controls.className = 'server-controls';
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = '删除';
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                deleteServer(server.id);
            };
            
            controls.appendChild(deleteBtn);
            
            header.appendChild(title);
            header.appendChild(controls);
            
            // 大区内容
            const content = document.createElement('div');
            content.className = 'server-content';
            
            // 角色选择器
            const roleSelector = document.createElement('div');
            roleSelector.className = 'role-selector';
            roleSelector.id = `roles-${server.id}`;
            
            // 初始化当前选中角色
            if (!currentRoles[server.id]) {
                currentRoles[server.id] = '全部';
            }
            
            // 渲染角色标签
            server.roles.forEach((role, index) => {
                const roleTag = document.createElement('span');
                roleTag.className = 'role-tag';
                if (role === currentRoles[server.id]) {
                    roleTag.classList.add('active');
                }
                roleTag.textContent = role;
                roleTag.title = '双击编辑名称';
                roleTag.style.cursor = 'pointer';
                
                // 单击和双击检测
                let clickTimer = null;
                
                roleTag.addEventListener('click', (e) => {
                    e.stopPropagation();
                    
                    if (clickTimer) {
                        // 双击
                        clearTimeout(clickTimer);
                        clickTimer = null;
                        
                        // 编辑角色名称（除了“全部”）
                        if (role !== '全部') {
                            editRoleName(server.id, index, roleTag);
                        }
                    } else {
                        // 单击 - 延迟执行以检测是否为双击
                        clickTimer = setTimeout(() => {
                            clickTimer = null;
                            selectRole(server.id, role);
                        }, 250);
                    }
                });
                
                roleSelector.appendChild(roleTag);
            });
            
            // 添加角色按钮
            const addRoleBtn = document.createElement('button');
            addRoleBtn.textContent = '+';
            addRoleBtn.style.padding = '1px 4px';
            addRoleBtn.style.fontSize = '9px';
            addRoleBtn.onclick = (e) => {
                e.stopPropagation();
                addRole(server.id);
            };
            roleSelector.appendChild(addRoleBtn);
            
            // 删除角色按钮（至少保留"全部"）
            if (server.roles.length > 1) {
                const deleteRoleBtn = document.createElement('button');
                deleteRoleBtn.textContent = '-';
                deleteRoleBtn.style.padding = '1px 4px';
                deleteRoleBtn.style.fontSize = '9px';
                deleteRoleBtn.style.backgroundColor = '#f44336';
                deleteRoleBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteRole(server.id);
                };
                roleSelector.appendChild(deleteRoleBtn);
            }
            
            content.appendChild(roleSelector);
            
            // 任务列表区域（直接作为网格容器）
            const taskList = document.createElement('div');
            taskList.className = 'task-list';
            taskList.id = `list-${server.id}`;
            
            content.appendChild(taskList);
            
            // 添加任务区域
            const addTaskDiv = document.createElement('div');
            addTaskDiv.className = 'add-task';
            
            // 第一行：任务输入框（使用flex布局，添加overflow: visible确保下拉框不被裁剪）
            const row1 = document.createElement('div');
            row1.className = 'add-task-row';
            row1.style.position = 'relative';
            row1.style.display = 'flex';
            row1.style.gap = '5px';
            row1.style.alignItems = 'center';
            row1.style.overflow = 'visible';
            
            // 历史记录下拉框（先定义，避免后面使用时未定义）
            const historyDropdown = document.createElement('div');
            historyDropdown.className = 'task-history-dropdown';
            historyDropdown.id = `history-${server.id}`;
            historyDropdown.style.display = 'none';
            
            const taskInput = document.createElement('input');
            taskInput.type = 'text';
            taskInput.placeholder = '输入任务...';
            taskInput.id = `input-${server.id}`;
            taskInput.autocomplete = 'off';
            taskInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    addTaskToServer(server.id);
                }
            });
            
            // 输入框事件：显示历史记录
            taskInput.addEventListener('input', () => {
                showTaskHistory(server.id);
            });
            
            taskInput.addEventListener('focus', () => {
                showTaskHistory(server.id);
            });
            
            // 点击其他地方关闭历史记录
            document.addEventListener('click', (e) => {
                if (!taskInput.contains(e.target) && !historyDropdown.contains(e.target)) {
                    historyDropdown.style.display = 'none';
                }
            });
            
            row1.appendChild(taskInput);
            row1.appendChild(historyDropdown);
            addTaskDiv.appendChild(row1);
            
            // 第二行：日期、重复、角色、颜色、添加按钮
            const row2 = document.createElement('div');
            row2.className = 'add-task-row';
                        
            const dateInput = document.createElement('input');
            dateInput.type = 'datetime-local';
            dateInput.id = `date-${server.id}`;
            // 默认设置为当前时间
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            dateInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
                        
            // 重复类型选择器（标签式）
            const repeatContainer = document.createElement('div');
            repeatContainer.id = `repeat-container-${server.id}`;
            repeatContainer.style.cssText = `
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                padding: 4px;
                background-color: #f5f5f5;
                border-radius: 4px;
                min-height: 32px;
            `;
            
            // 存储选中的值
            const selectedRepeats = new Set(['none']); // 默认选中"一次性"
            repeatContainer.dataset.selected = 'none';
            
            // 创建选项标签
            const repeatOptions = [
                { value: 'none', label: '一次性' },
                { value: 'daily', label: '每日' },
                { value: 'weekly-1', label: '周一' },
                { value: 'weekly-2', label: '周二' },
                { value: 'weekly-3', label: '周三' },
                { value: 'weekly-4', label: '周四' },
                { value: 'weekly-5', label: '周五' },
                { value: 'weekly-6', label: '周六' },
                { value: 'weekly-0', label: '周日' }
            ];
            
            repeatOptions.forEach(opt => {
                const tag = document.createElement('span');
                tag.className = 'repeat-tag';
                tag.dataset.value = opt.value;
                tag.textContent = opt.label;
                const isSelected = opt.value === 'none';
                tag.style.cssText = `
                    padding: 4px 10px;
                    font-size: 11px;
                    border-radius: 3px;
                    cursor: pointer;
                    transition: all 0.2s;
                    user-select: none;
                    background-color: ${isSelected ? '#9C27B0' : 'white'};
                    color: ${isSelected ? 'white' : '#333'};
                    border: ${isSelected ? '1px solid #9C27B0' : '1px solid #ddd'};
                `;
                
                tag.onclick = () => {
                    if (selectedRepeats.has(opt.value)) {
                        // 取消选中（但至少要保留一个选项）
                        if (selectedRepeats.size > 1) {
                            selectedRepeats.delete(opt.value);
                            tag.style.backgroundColor = 'white';
                            tag.style.color = '#333';
                            tag.style.border = '1px solid #ddd';
                        }
                    } else {
                        // 选中
                        selectedRepeats.add(opt.value);
                        tag.style.backgroundColor = '#9C27B0';
                        tag.style.color = 'white';
                        tag.style.border = '1px solid #9C27B0';
                    }
                    // 更新dataset
                    repeatContainer.dataset.selected = Array.from(selectedRepeats).join(',');
                };
                
                repeatContainer.appendChild(tag);
            });
                        
            // 角色选择下拉框
            const roleSelect = document.createElement('select');
            roleSelect.id = `role-${server.id}`;
                        
            // 添加“全部角色”选项（默认选中）
            const allOption = document.createElement('option');
            allOption.value = '__all__';
            allOption.textContent = '全部角色';
            allOption.selected = true; // 默认选中全部角色
            roleSelect.appendChild(allOption);
                        
            server.roles.forEach(role => {
                const option = document.createElement('option');
                option.value = role;
                option.textContent = role;
                // 移除这里的默认选中逻辑，让“全部角色”始终为默认
                roleSelect.appendChild(option);
            });
            
            // 颜色选择器（直接显示一排小颜色方块）
            const colorPickerWrapper = document.createElement('div');
            colorPickerWrapper.style.cssText = `
                display: flex;
                gap: 3px;
                align-items: center;
            `;
            colorPickerWrapper.dataset.selectedColor = '#9C27B0'; // 存储选中的颜色
            
            // 预设颜色列表
            const presetColors = [
                '#9C27B0', // 紫色
                '#F44336', // 红色
                '#2196F3', // 蓝色
                '#4CAF50', // 绿色
                '#FF9800', // 橙色
                '#E91E63', // 粉红
                '#00BCD4', // 青色
                '#FFEB3B', // 黄色
                '#795548', // 棕色
                '#607D8B', // 灰蓝
            ];
            
            presetColors.forEach(color => {
                const colorOption = document.createElement('div');
                colorOption.style.cssText = `
                    width: 20px;
                    height: 20px;
                    background-color: ${color};
                    border: 2px solid transparent;
                    border-radius: 3px;
                    cursor: pointer;
                    transition: all 0.2s;
                `;
                if (color === '#9C27B0') {
                    colorOption.style.borderColor = '#333';
                    colorOption.style.boxShadow = '0 0 0 1px white, 0 0 0 2px #333';
                }
                colorOption.onclick = (e) => {
                    e.stopPropagation();
                    // 更新选中的颜色到 wrapper 的 dataset
                    colorPickerWrapper.dataset.selectedColor = color;
                    // 更新所有颜色方块的选中状态
                    colorPickerWrapper.querySelectorAll('div').forEach(opt => {
                        opt.style.borderColor = 'transparent';
                        opt.style.boxShadow = 'none';
                    });
                    colorOption.style.borderColor = '#333';
                    colorOption.style.boxShadow = '0 0 0 1px white, 0 0 0 2px #333';
                };
                colorPickerWrapper.appendChild(colorOption);
            });
                        
            const addBtn = document.createElement('button');
            addBtn.textContent = '添加';
            addBtn.onclick = () => addTaskToServer(server.id);
            addBtn.style.whiteSpace = 'nowrap';
                        
            row2.appendChild(dateInput);
            row2.appendChild(repeatContainer);
            row2.appendChild(roleSelect);
            row2.appendChild(colorPickerWrapper);
            row2.appendChild(addBtn);
            addTaskDiv.appendChild(row2);
            
            content.appendChild(addTaskDiv);
            
            section.appendChild(header);
            section.appendChild(content);
            
            return section;
        }
        
        // 切换大区折叠状态（已移除）
        // function toggleServerCollapse(serverId) { ... }
        
        // 选择角色
        function selectRole(serverId, role) {
            currentRoles[serverId] = role;
            renderServers();
            renderTasks();
        }
        
        // 编辑角色名称
        function editRoleName(serverId, roleIndex, roleTag) {
            const server = servers.find(s => s.id === serverId);
            if (!server || roleIndex === 0) {
                console.log('不能编辑全部角色');
                return; // 不能编辑“全部”
            }
            
            console.log('开始编辑角色:', server.roles[roleIndex]);
            
            const oldName = server.roles[roleIndex];
            
            // 将标签转换为输入框
            const input = document.createElement('input');
            input.type = 'text';
            input.value = oldName;
            input.className = 'role-tag';
            input.style.cssText = `
                border: 1px solid #667eea;
                border-radius: 10px;
                padding: 2px 6px;
                font-size: 10px;
                width: 80px;
                outline: none;
                background-color: white;
                color: #333;
            `;
            
            roleTag.replaceWith(input);
            
            // 延迟聚焦确保DOM已更新
            setTimeout(() => {
                input.focus();
                input.select();
            }, 10);
            
            // 保存新名称
            const saveName = () => {
                const newName = input.value.trim();
                console.log('保存角色名称:', newName);
                
                if (newName && newName !== oldName) {
                    // 更新所有使用该角色的任务
                    server.tasks.forEach(task => {
                        if (task.role === oldName) {
                            task.role = newName;
                        }
                    });
                    
                    server.roles[roleIndex] = newName;

        // 设置下次重置时间
        function setNextResetTime(serverId, taskId, resetDay) {
            const server = servers.find(s => s.id === serverId);
            if (!server) return;
            
            const task = server.tasks.find(t => t.id === taskId);
            if (!task) return;
            
            // 计算下一个指定星期的刷新时刻（根据任务类型决定刷新时间）
            // 该函数仅在多重置日任务 UI 中被调用，因此使用全局刷新时间设置
            const { hour, minute } = getTaskResetTime(task);
            const nextReset = new Date();
            const currentDay = nextReset.getDay();
            let daysUntilReset = (resetDay - currentDay + 7) % 7;
            if (daysUntilReset === 0) {
                daysUntilReset = 7; // 如果是同一天，就设置为下周
            }

            nextReset.setDate(nextReset.getDate() + daysUntilReset);
            nextReset.setHours(hour, minute, 0, 0);

            task.nextResetTime = nextReset.toISOString();

            saveServers();
            renderTasks();
            const timeStr = String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
            showToast(`已设置下次重置时间为${resetDay === 0 ? '周日' : '周' + ['一', '二', '三', '四', '五', '六'][resetDay-1]} ${timeStr}`, 'success');
        }
        
        // 切换任务完成状态
        function toggleTaskCompletion(serverId, taskId) {
            const server = servers.find(s => s.id === serverId);
            if (!server) return;
            
            const task = server.tasks.find(t => t.id === taskId);
            if (!task) return;
            
            // 兼容旧数据：确保 repeat 为数组
            if (!Array.isArray(task.repeat)) {
                task.repeat = [task.repeat];
            }

            // 用统一的周期判断函数决定当前是否已完成
            if (isTaskCompletedNow(task)) {
                // 当前周期已完成，点击则取消完成
                task.completed = false;
                task.lastCompleted = null;
            } else {
                // 标记完成，记录完整时间戳（精确到时刻，便于跨刷新点判断）
                task.completed = true;
                task.lastCompleted = new Date().toISOString();

                // 更新下次完成日期
                const repeat = task.repeat;

                // 检查是否包含每日或每周重置
                const hasDaily = task.repeat.includes('daily');
                const weeklyDays = task.repeat.filter(r => r.startsWith('weekly-'));
                const hasWeekly = weeklyDays.length > 0;
                const hasNone = task.repeat.includes('none');

                if (hasDaily) {
                    // 每日任务：单重置任务，固定 00:00 刷新（过 12 点重置）
                    const { hour, minute } = getTaskResetTime(task);
                    const now = new Date();
                    const todayReset = new Date(now);
                    todayReset.setHours(hour, minute, 0, 0);
                    const nextReset = now.getTime() >= todayReset.getTime()
                        ? new Date(todayReset.getTime() + 24 * 3600 * 1000)
                        : todayReset;
                    task.nextDate = nextReset.toISOString();
                    task.nextResetTime = nextReset.toISOString();
                } else if (hasWeekly) {
                    // 每周任务：下一个刷新时刻 = 当前周期结束时刻
                    // 多重置日使用全局刷新时间设置，单重置日使用 00:00
                    const resetDayNums = weeklyDays.map(r => parseInt(r.split('-')[1]));
                    const { hour, minute } = getTaskResetTime(task);
                    const { nextMoment } = getCurrentCycleBounds(new Date(), resetDayNums, hour, minute);
                    if (nextMoment) {
                        task.nextDate = nextMoment.toISOString();
                        task.nextResetTime = nextMoment.toISOString();
                    }
                } else if (hasNone) {
                    // 一次性任务：检查同组的所有一次性任务是否都完成了
                    const sameGroupTasks = server.tasks.filter(t => 
                        t.text === task.text && 
                        Array.isArray(t.repeat) && t.repeat.includes('none')
                    );
                    
                    const allCompleted = sameGroupTasks.every(t => 
                        t.completed && t.lastCompleted === today
                    );
                    
                    if (allCompleted && sameGroupTasks.length > 0) {
                        // 同组的所有一次性任务都完成了，删除整个分组
                        sameGroupTasks.forEach(t => {
                            const index = server.tasks.findIndex(task => task.id === t.id);
                            if (index !== -1) {
                                server.tasks.splice(index, 1);
                            }
                        });
                        showToast('所有一次性任务已完成，分组已删除', 'info');
                        saveServers();
                        renderTasks();
                        updateDate();
                        return;
                    }
                }
            }
            
            saveServers();
            renderTasks();
            updateDate();
        }

        // 删除整个任务分组（所有角色的同名任务）
        function deleteTaskGroup(serverId, taskName) {
            const server = servers.find(s => s.id === serverId);
            if (!server) return;
            
            // 过滤掉所有匹配任务名的任务
            const beforeCount = server.tasks.length;
            server.tasks = server.tasks.filter(task => task.text !== taskName);

            if (deletedCount > 0) {

                renderTasks();
                updateDate();
                showToast(`已删除${deletedCount}个“${taskName}”任务`, 'info');

        // 批量完成组内所有任务
        function completeAllTasksInGroup(serverId, taskName) {
            const server = servers.find(s => s.id === serverId);
            if (!server) return;
            
            const today = new Date().toDateString();
            const tasksToComplete = server.tasks.filter(task => task.text === taskName);
            
            if (tasksToComplete.length === 0) {
                showToast('没有找到任务', 'warning');
                return;
            }
            
            let completedCount = 0;
            tasksToComplete.forEach(task => {
                // 兼容旧数据：如果是字符串，转换为数组
                if (!Array.isArray(task.repeat)) {
                    task.repeat = [task.repeat];
                }
                
                if (!task.completed || task.lastCompleted !== today) {
                    task.completed = true;
                    task.lastCompleted = today;
                    
                    // 更新下次完成日期
                    const hasDaily = task.repeat.includes('daily');
                    const weeklyDays = task.repeat.filter(r => r.startsWith('weekly-'));
                    const hasWeekly = weeklyDays.length > 0;
                    
                    if (hasDaily) {
                        // 每日任务：单重置任务，固定 00:00 刷新
                        const { hour, minute } = getTaskResetTime(task);
                        const now = new Date();
                        const todayReset = new Date(now);
                        todayReset.setHours(hour, minute, 0, 0);
                        const nextReset = now.getTime() >= todayReset.getTime()
                            ? new Date(todayReset.getTime() + 24 * 3600 * 1000)
                            : todayReset;
                        task.nextDate = nextReset.toISOString();
                        task.nextResetTime = nextReset.toISOString();
                    } else if (hasWeekly) {
                        // 每周任务：根据任务类型决定刷新时刻
                        // 多重置日使用全局刷新时间设置，单重置日使用 00:00
                        const resetDayNums = weeklyDays.map(r => parseInt(r.split('-')[1]));
                        const { hour, minute } = getTaskResetTime(task);
                        const { nextMoment } = getCurrentCycleBounds(new Date(), resetDayNums, hour, minute);
                        if (nextMoment) {
                            task.nextDate = nextMoment.toISOString();
                            task.nextResetTime = nextMoment.toISOString();
                        }
                    }
                    
                    completedCount++;
                }
            });
            
            if (completedCount > 0) {
                saveServers();
                renderTasks();
                updateDate();
                showToast(`已完成${completedCount}个“${taskName}”任务`, 'success');
            } else {
                showToast('所有任务已完成', 'info');
            }
        }
        // 批量取消完成任务
        function uncompleteAllTasksInGroup(serverId, taskName) {
            const server = servers.find(s => s.id === serverId);

        // 将重复类型数组转换为显示文本
        function getRepeatDisplayText(repeat) {
            if (!repeat || !Array.isArray(repeat)) return '一次性';
            
            const dayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const parts = [];
            
            repeat.forEach(r => {
                if (r === 'none') {
                    parts.push('一次性');
                } else if (r === 'daily') {
                    parts.push('每日');
                } else if (r.startsWith('weekly-')) {
                    const resetDay = parseInt(r.split('-')[1]);
                    parts.push(dayNames[resetDay]); // 简化为"周三"而不是"每周三"
                }
            });
            
            return parts.join(' ');
        }
        
        // 创建任务元素
        function createTaskElement(serverId, task) {
            const div = document.createElement('div');
            div.className = 'task-item';
            
            // 兼容旧数据：如果是字符串，转换为数组
            if (!Array.isArray(task.repeat)) {
                task.repeat = [task.repeat];
            }
                            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            
            // 判断任务是否应该显示为已完成（基于刷新时刻的周期判断）
            let shouldShowCompleted = isTaskCompletedNow(task);

            checkbox.checked = shouldShowCompleted;
            checkbox.addEventListener('change', () => toggleTaskCompletion(serverId, task.id));
                            
            const controls = document.createElement('div');
            controls.className = 'task-controls';
            controls.style.flex = '1'; // 让 controls 占据剩余空间
                            
            // 角色标签（如果不是"全部"）
            if (task.role && task.role !== '全部') {
                const roleBadge = document.createElement('span');
                roleBadge.className = 'repeat-badge';
                // 使用任务的自定义颜色
                const roleColor = task.color || '#9C27B0';
                roleBadge.style.backgroundColor = roleColor;
                roleBadge.style.color = '#fff'; // 白色文字
                roleBadge.textContent = task.role;
                roleBadge.style.cursor = 'pointer';
                roleBadge.style.flexShrink = '0'; // 防止被压缩
                roleBadge.style.whiteSpace = 'nowrap';
                roleBadge.title = '点击切换完成状态';
                if (shouldShowCompleted) {
                    // 已完成：红色删除线（更显眼）
                    roleBadge.style.textDecoration = 'line-through';
                    roleBadge.style.textDecorationColor = '#e53935';
                    roleBadge.style.textDecorationThickness = '2px';
                    roleBadge.style.textDecorationSkipInk = 'none';
                }
                // 点击角色标签也可以切换完成状态
                roleBadge.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleTaskCompletion(serverId, task.id);
                });
                controls.appendChild(roleBadge);
            }
                                        
            // 日期显示
            const dateBadge = document.createElement('span');
            dateBadge.className = 'repeat-badge';
            dateBadge.style.cursor = 'pointer';
            dateBadge.style.flexShrink = '0'; // 防止日期标签被压缩
                                        
            const nextDate = new Date(task.nextDate);
            const todayDate = new Date();
            
            // 如果是多重置日任务，需要分别显示每个重置日的完成状态
            if (Array.isArray(task.repeat) && task.repeat.filter(r => r.startsWith('weekly-')).length > 1) {
                // 有多重每周重置日，创建多个标签
                dateBadge.style.display = 'flex';
                dateBadge.style.gap = '4px';
                dateBadge.style.flexWrap = 'wrap';
                dateBadge.style.padding = '2px';
                dateBadge.style.backgroundColor = 'transparent';
                
                const dayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                const weeklyDays = task.repeat.filter(r => r.startsWith('weekly-'));
                
                // 此分支仅多重置日任务进入，使用全局刷新时间设置
                const resetDayNumsForCycle = weeklyDays.map(r => parseInt(r.split('-')[1]));
                const { hour: cycleHour, minute: cycleMinute } = getTaskResetTime(task);
                const cycleBounds = getCurrentCycleBounds(new Date(), resetDayNumsForCycle, cycleHour, cycleMinute);
                // 当前周期对应的重置日 = 当前周期开始时刻(prevMoment)的星期几
                let currentCycleDay = cycleBounds.prevMoment ? cycleBounds.prevMoment.getDay() : null;

                // 为每个重置日创建独立的标签
                weeklyDays.forEach(resetValue => {
                    const resetDay = parseInt(resetValue.split('-')[1]);
                    const dayTag = document.createElement('span');
                    dayTag.textContent = dayNames[resetDay];
                    dayTag.style.cssText = `
                        display: inline-block;
                        min-width: 28px;
                        text-align: center;
                        padding: 2px 6px;
                        border-radius: 3px;
                        font-size: 11px;
                        background-color: ${task.color || '#9C27B0'};
                        color: white;
                        cursor: pointer;
                    `;
                    // 如果这个重置日已经完成，添加删除线（不改背景，避免宽度变化）
                    if (resetDay === currentCycleDay && shouldShowCompleted) {
                        // 已完成：红色删除线
                        dayTag.style.textDecoration = 'line-through';
                        dayTag.style.textDecorationColor = '#e53935';
                        dayTag.style.textDecorationThickness = '2px';
                        dayTag.style.textDecorationSkipInk = 'none';
                    }
                    
                    // 点击单个重置日标签可以设置它为下次重置时间
                    dayTag.title = `点击设置为下次重置日`;
                    dayTag.addEventListener('click', (e) => {
                        e.stopPropagation();
                        setNextResetTime(serverId, task.id, resetDay);
                    });
                    
                    dateBadge.appendChild(dayTag);
                });
                
                // “下次”提示文字已按用户要求移除
            } else {
                // 单重置日或一次性/每日任务，使用原有逻辑
                const repeatText = getRepeatDisplayText(task.repeat);
                dateBadge.textContent = repeatText;
                
                // 使用任务的自定义颜色
                const dateColor = task.color || '#9C27B0';
                dateBadge.style.backgroundColor = dateColor;
                dateBadge.style.color = '#fff';
                
                // 如果是一次性任务且已过期，显示红色
                if (repeatText === '一次性' && nextDate < todayDate && !task.completed) {
                    dateBadge.style.backgroundColor = '#ffcdd2'; // 红色
                    dateBadge.style.color = '#c62828';
                }
                // 如果任务完成，添加删除线（不改背景，避免宽度变化）
                if (shouldShowCompleted) {
                    // 已完成：红色删除线
                    dateBadge.style.textDecoration = 'line-through';
                    dateBadge.style.textDecorationColor = '#e53935';
                    dateBadge.style.textDecorationThickness = '2px';
                    dateBadge.style.textDecorationSkipInk = 'none';
                }
            }
            // 点击日期标签也可以切换完成状态
            dateBadge.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleTaskCompletion(serverId, task.id);
            });
            controls.appendChild(dateBadge);
                            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = '×';
            deleteBtn.addEventListener('click', () => deleteTask(serverId, task.id));
            controls.appendChild(deleteBtn);
                            
            div.appendChild(checkbox);
            div.appendChild(controls);
                            
            return div;
        }

        // 获取任务历史记录
        function getTaskHistory() {
            const history = localStorage.getItem('taskInputHistory');
            return history ? JSON.parse(history) : [];
        }
        
        // 保存任务历史记录
        function saveTaskHistory(history) {
            localStorage.setItem('taskInputHistory', JSON.stringify(history));
        }
        
        // 添加任务到历史记录
        function addToTaskHistory(taskText) {
            if (!taskText || !taskText.trim()) return;
            
            console.log('保存任务到历史记录:', taskText);
            
            let history = getTaskHistory();
            console.log('当前历史记录数量:', history.length);
            
            // 如果已存在，先移除
            history = history.filter(item => item !== taskText.trim());
            
            // 添加到开头
            history.unshift(taskText.trim());
            
            // 只保留最近20条
            if (history.length > 20) {
                history = history.slice(0, 20);
            }
            
            saveTaskHistory(history);
            console.log('保存后历史记录数量:', history.length);
        }
        
        // 显示任务历史记录
        function showTaskHistory(serverId) {
            const dropdown = document.getElementById(`history-${serverId}`);
            if (!dropdown) {
                console.log('未找到下拉框元素:', `history-${serverId}`);
                return;
            }
            
            const history = getTaskHistory();
            console.log('显示历史记录，数量:', history.length);
            
            if (history.length === 0) {
                console.log('历史记录为空，隐藏下拉框');
                dropdown.style.display = 'none';
                return;
            }
            
            dropdown.innerHTML = '';
            
            // 添加历史记录项
            history.forEach(taskText => {
                const item = document.createElement('div');
                item.className = 'history-item';
                
                const textSpan = document.createElement('span');
                textSpan.textContent = taskText;
                textSpan.style.flex = '1';
                textSpan.onclick = () => {
                    const input = document.getElementById(`input-${serverId}`);
                    if (input) {
                        input.value = taskText;
                        dropdown.style.display = 'none';
                    }
                };
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'history-delete-btn';
                deleteBtn.textContent = '删除';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteTaskHistoryItem(taskText);
                    showTaskHistory(serverId);
                };
                
                item.appendChild(textSpan);
                item.appendChild(deleteBtn);
                dropdown.appendChild(item);
            });
            
            // 添加清空全部按钮
            const clearAll = document.createElement('div');
            clearAll.className = 'history-clear-all';
            clearAll.textContent = '清空全部记录';
            clearAll.onclick = () => {
                clearAllTaskHistory();
                dropdown.style.display = 'none';
            };
            dropdown.appendChild(clearAll);
            
            // 使用fixed定位，相对于视口，不受父容器overflow影响
            const input = document.getElementById(`input-${serverId}`);
            if (input) {
                const rect = input.getBoundingClientRect();
                const viewportHeight = window.innerHeight;
                const dropdownHeight = 200; // 预估下拉框高度
                
                dropdown.style.display = 'block';
                dropdown.style.position = 'fixed';
                dropdown.style.left = rect.left + 'px';
                dropdown.style.width = rect.width + 'px';
                dropdown.style.zIndex = '99999';
                
                // 判断下拉框应该显示在输入框上方还是下方
                const spaceBelow = viewportHeight - rect.bottom;
                const spaceAbove = rect.top;
                
                if (spaceBelow < dropdownHeight && spaceAbove > spaceBelow) {
                    // 下方空间不足，上方空间足够，显示在上方
                    dropdown.style.top = (rect.top - dropdownHeight - 2) + 'px';
                    dropdown.style.bottom = 'auto';
                    console.log('下拉框显示在输入框上方');
                } else {
                    // 默认显示在下方
                    dropdown.style.top = (rect.bottom + 2) + 'px';
                    dropdown.style.bottom = 'auto';
                    console.log('下拉框显示在输入框下方');
                }
                
                console.log('下拉框定位:', {
                    top: dropdown.style.top,
                    left: dropdown.style.left,
                    width: dropdown.style.width,
                    spaceBelow: spaceBelow,
                    spaceAbove: spaceAbove
                });
            }
        }

            let history = getTaskHistory();

            saveTaskHistory(history);

        // 导出数据功能
        function exportData() {
            const data = {
                servers: servers,
                soundEnabled: soundEnabled,
                soundDuration: soundDuration,
                exportDate: new Date().toISOString(),
                version: '2.0'
            };
            
            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            
            // 获取自定义文件名前缀（如果没有设置则使用默认值）
            let fileNamePrefix = localStorage.getItem('exportFileNamePrefix') || '游戏待办备份';
            
            // 获取或初始化导出计数
            let exportCount = parseInt(localStorage.getItem('exportCount') || '0');
            exportCount++;
            localStorage.setItem('exportCount', exportCount.toString());
            
            // 构建文件名：前缀_序号.json（不含日期）
            const fileName = `${fileNamePrefix}_${String(exportCount).padStart(3, '0')}.json`;
            
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            showToast(`数据已导出：${fileName}`, 'success');
        }

            dialog.classList.add('show');
