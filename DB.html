            overlay.classList.remove('show');
            dialog.classList.remove('show');
        }
        
        // 保存导出设置
        function saveExportSettings() {
            const prefixInput = document.getElementById('exportPrefixInput');
            const prefix = prefixInput.value.trim();
            
            if (!prefix) {
                showToast('⚠️ 请输入导出文件名前缀', 'warning');
                return;
            }
            
            // 保存到localStorage
            localStorage.setItem('exportFileNamePrefix', prefix);
            showToast(`✅ 导出前缀已保存为: ${prefix}`, 'success');
            closeExportSettingsModal();
        }
        
        // 重置导出计数器
        function resetExportCounter() {
            localStorage.setItem('exportCount', '0');
            showToast('✅ 序列号已重置为 1', 'success');
            // 更新显示
            const counterDisplay = document.getElementById('currentCounterDisplay');
            counterDisplay.textContent = '001';
            closeExportSettingsModal();
        }
        // 导入数据功能
        function importData(inputElement) {
            const file = inputElement.files[0];
            if (!file) {
                showToast('请选择要导入的文件', 'warning');
                return;
            }
            
            console.log('导入文件:', file.name, '大小:', file.size, 'bytes');
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const fileContent = e.target.result;
                    console.log('文件内容长度:', fileContent.length);
                    console.log('文件内容预览:', fileContent.substring(0, 200));
                    
                    const importedData = JSON.parse(fileContent);
                    console.log('解析后的数据:', importedData);
                    
                    // 验证数据格式
                    if (!importedData.servers || !Array.isArray(importedData.servers)) {
                        console.error('数据格式错误:', importedData);
                        throw new Error('无效的数据格式，必须包含 servers 数组');
                    }
                    
                    if (importedData.servers.length === 0) {
                        throw new Error('数据为空，没有大区数据');
                    }
                    
                    console.log('导入的大区数量:', importedData.servers.length);
                    
                    servers = importedData.servers;
                    
                    // 导入声音设置（如果存在）
                    if (importedData.soundEnabled !== undefined) {
                        soundEnabled = importedData.soundEnabled;
                        document.getElementById('sound-toggle').checked = soundEnabled;
                        localStorage.setItem('todoSoundEnabled', soundEnabled);
                    }
                    
                    // 导入声音时长设置（如果存在）
                    if (importedData.soundDuration !== undefined) {
                        soundDuration = importedData.soundDuration;
                        const durationInput = document.getElementById('sound-duration');
                        const durationValue = document.getElementById('duration-value');
                        if (durationInput) durationInput.value = soundDuration;
                        if (durationValue) durationValue.textContent = soundDuration.toFixed(1) + '秒';
                        localStorage.setItem('todoSoundDuration', soundDuration);
                    }
                    
                    saveServers();
                    renderServers();
                    
                    // 确保DOM创建后再渲染任务
                    setTimeout(() => {
                        renderTasks();
                    }, 0);
                    
                    updateDate();
                    
                    const totalTasks = servers.reduce((sum, server) => sum + server.tasks.length, 0);
                    showToast(`数据导入成功！${servers.length}个大区，${totalTasks}个任务`, 'success');
                    console.log('导入完成，当前大区数量:', servers.length);
                } catch (error) {
                    console.error('导入失败:', error);
                    showToast('导入失败：' + error.message, 'error');
                }
            };
            
            reader.onerror = function(e) {
                console.error('文件读取失败:', e);
                showToast('文件读取失败', 'error');
            };
            
            reader.readAsText(file);
            
            // 重置文件输入框，以便可以重复导入同一文件
            inputElement.value = '';
        }
        
        // 清空所有数据功能
        function clearAllData() {
            servers = [
                {
                    id: 'server-1',
                    name: '默认大区',
                    tasks: [],
                    collapsed: false,
                    roles: ['全部']
                }
            ];
            currentRoles = {};
            saveServers();
            renderServers();
            updateDate();
            showToast('所有数据已清空！', 'info');
        }
        
        // 检查重复任务并重置（每天执行）
        function checkAndResetRecurringTasks() {
            const today = new Date();
            const todayDateString = today.toDateString();
            const todayDay = today.getDay(); // 今天是星期几
            const lastCheck = localStorage.getItem('lastRecurringCheck');
            
            // 如果上次检查不是今天，则重置重复任务
            if (lastCheck !== todayDateString) {
                let changed = false;
                
                servers.forEach(server => {
                    server.tasks.forEach(task => {
                        // 兼容旧数据：如果是字符串，转换为数组
                        if (!Array.isArray(task.repeat)) {
                            task.repeat = [task.repeat];
                        }
                        
                        // 只有重复任务且已完成的任务才需要检查重置
                        const hasDaily = task.repeat.includes('daily');
                        const weeklyDays = task.repeat.filter(r => r.startsWith('weekly-'));
                        const hasWeekly = weeklyDays.length > 0;
                        
                        if ((hasDaily || hasWeekly) && task.completed && task.lastCompleted) {
                            // 基于刷新时刻判断当前周期是否已完成
                            if (!isTaskCompletedNow(task)) {
                                // 当前周期未完成（已过刷新点），重置完成状态
                                task.completed = false;
                                task.lastCompleted = null;
                                // 更新 nextDate 为下一个刷新时刻
                                if (hasDaily) {
                                    // 单重置任务：固定 00:00 刷新
                                    const { hour, minute } = getTaskResetTime(task);
                                    const now = new Date();
                                    const todayReset = new Date(now);
                                    todayReset.setHours(hour, minute, 0, 0);
                                    const nextReset = now.getTime() >= todayReset.getTime()
                                        ? new Date(todayReset.getTime() + 24 * 3600 * 1000)
                                        : todayReset;
                                    task.nextDate = nextReset.toISOString();
                                    task.nextResetTime = nextReset.toISOString();
                                } else if (hasWeekly) {
                                    const resetDayNums = weeklyDays.map(r => parseInt(r.split('-')[1]));
                                    const { hour, minute } = getTaskResetTime(task);
                                    const { nextMoment } = getCurrentCycleBounds(new Date(), resetDayNums, hour, minute);
                                    if (nextMoment) {
                                        task.nextDate = nextMoment.toISOString();
                                        task.nextResetTime = nextMoment.toISOString();
                                    }
                                }
                                changed = true;
                            }
                        }
                    });
                });

                if (changed) {
                    saveServers();
                }
                
                // 更新最后检查日期
                localStorage.setItem('lastRecurringCheck', todayDateString);
            }
        }
        
        // 打开刷新时间设置弹窗
        function openResetTimeSettings() {
            const { hour, minute } = getResetTime();
            const timeStr = String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
            const input = document.getElementById('reset-time-input');
            if (input) input.value = timeStr;
            document.getElementById('reset-time-overlay').style.display = 'block';
            document.getElementById('reset-time-dialog').style.display = 'block';
        }

        // 隐藏刷新时间设置弹窗
        function hideResetTimeSettings() {
            document.getElementById('reset-time-overlay').style.display = 'none';
            document.getElementById('reset-time-dialog').style.display = 'none';
        }

        // 保存刷新时间设置
        function saveResetTimeSettings() {
            const input = document.getElementById('reset-time-input');
            if (!input || !input.value) {
                showToast('请选择刷新时间');
                return;
            }
            const value = input.value.trim();
            if (!/^\d{1,2}:\d{2}$/.test(value)) {
                showToast('时间格式不正确');
                return;
            }
            localStorage.setItem('gameTodoResetTime', value);
            hideResetTimeSettings();
            const parts = value.split(':');
            const timeStr = parts[0].padStart(2, '0') + ':' + parts[1];
            showToast('刷新时间已设置为 ' + timeStr);
            renderTasks();
        }
        // 获取全局刷新时间设置（默认 22:00）
        // 仅对多重置日任务生效；单重置日 / 每日任务固定使用 00:00（午夜）刷新
        function getResetTime() {
            const saved = localStorage.getItem('gameTodoResetTime');
            if (saved && /^\d{1,2}:\d{2}$/.test(saved)) {
                const parts = saved.split(':');
                return { hour: parseInt(parts[0]), minute: parseInt(parts[1]) };
            }
            return { hour: 22, minute: 0 };
        }

        // 根据任务类型返回该任务实际使用的刷新时刻
        // - 多重置日任务（≥2 个 weekly-X）：使用全局刷新时间设置
        // - 单重置日任务 / 每日任务：固定使用 00:00（午夜，过 12 点重置）
        function getTaskResetTime(task) {
            if (!Array.isArray(task.repeat)) task.repeat = [task.repeat];
            const weeklyDays = task.repeat.filter(r => r.startsWith('weekly-'));
            const isMultiReset = weeklyDays.length > 1;
            if (isMultiReset) {
                return getResetTime();
            }
            return { hour: 0, minute: 0 };
        }

        // 计算当前时间所属周期的边界
        // 周期 = [prevMoment, nextMoment)，prevMoment 为上一个已过去的刷新时刻，nextMoment 为下一个刷新时刻
        // 当前周期对应的重置日 = nextMoment 的星期几
        // hour/minute 由调用方根据任务类型传入（多重置日使用全局设置，单重置日 / 每日使用 00:00）
        function getCurrentCycleBounds(now, resetDays, hour, minute) {
            let prevMoment = null;
            let nextMoment = null;

            resetDays.forEach(resetDay => {
                const base = new Date(now);
                base.setHours(hour, minute, 0, 0);
                const currentDay = base.getDay();
                let diff = (resetDay - currentDay + 7) % 7;
                base.setDate(base.getDate() + diff);
                const thisWeek = new Date(base);
                const lastWeek = new Date(base); lastWeek.setDate(lastWeek.getDate() - 7);
                const nextWeek = new Date(base); nextWeek.setDate(nextWeek.getDate() + 7);

                [lastWeek, thisWeek, nextWeek].forEach(m => {
                    if (m.getTime() <= now.getTime()) {
                        if (!prevMoment || m.getTime() > prevMoment.getTime()) prevMoment = new Date(m);
                    } else {
                        if (!nextMoment || m.getTime() < nextMoment.getTime()) nextMoment = new Date(m);
                    }
                });
            });

            return { prevMoment, nextMoment };
        }

        // 判断任务在当前周期内是否已完成（基于刷新时刻）
        function isTaskCompletedNow(task) {
            if (!task.completed || !task.lastCompleted) return false;
            if (!Array.isArray(task.repeat)) task.repeat = [task.repeat];

            const now = new Date();
            const lastCompleted = new Date(task.lastCompleted);
            if (isNaN(lastCompleted.getTime())) return false;

            const hasDaily = task.repeat.includes('daily');
            const weeklyDays = task.repeat.filter(r => r.startsWith('weekly-'));
            const hasWeekly = weeklyDays.length > 0;

            if (hasDaily) {
                // 单重置任务：固定 00:00 刷新（不受全局刷新时间设置影响）
                const { hour, minute } = getTaskResetTime(task);
                const todayReset = new Date(now);
                todayReset.setHours(hour, minute, 0, 0);
                const prevDailyReset = now.getTime() >= todayReset.getTime()
                    ? todayReset
                    : new Date(todayReset.getTime() - 24 * 3600 * 1000);
                return lastCompleted.getTime() >= prevDailyReset.getTime();
            } else if (hasWeekly) {
                const resetDayNums = weeklyDays.map(r => parseInt(r.split('-')[1]));
                const { hour, minute } = getTaskResetTime(task);
                const { prevMoment } = getCurrentCycleBounds(now, resetDayNums, hour, minute);
                if (!prevMoment) return false;
                return lastCompleted.getTime() >= prevMoment.getTime();
            }

            if (task.repeat.includes('none')) {
                return lastCompleted.toDateString() === now.toDateString();
            }
            return true;
        }

        // 判断从上次完成时间到现在，是否已经过了重置日
        function hasResetDayPassed(lastCompleted, today, resetDay) {
            // 找到最近的一个重置日（包括今天或之前的最近一个）
            const lastResetDate = getMostRecentResetDate(today, resetDay);
            
            // 如果上次完成时间在最近重置日之前，说明已经过了重置日，需要重置
            // 注意：lastCompleted 是完成当天的时间点，可能在当天的任意时刻
            // lastResetDate 是重置日当天的开始（00:00:00）
            
            // 比较日期部分（忽略时间）
            const lastCompletedDateOnly = new Date(lastCompleted);
            lastCompletedDateOnly.setHours(0, 0, 0, 0);
            
            return lastCompletedDateOnly < lastResetDate;
        }
        
        // 获取最近的一个重置日（今天或之前的最近一个）
        function getMostRecentResetDate(today, resetDay) {
            const result = new Date(today);
            result.setHours(0, 0, 0, 0);
            
            const currentDay = result.getDay();
            let daysDiff = currentDay - resetDay;
            
            // 如果今天是重置日，最近的重置日就是今天
            // 如果今天在重置日之后，最近的重置日是本周的重置日
            // 如果今天在重置日之前，最近的重置日是上周的重置日
            if (daysDiff < 0) {
                daysDiff += 7;
            }
            
            result.setDate(result.getDate() - daysDiff);
            return result;
        }
        
        // 获取下一个重置日期
        function getNextResetDate(fromDate, resetDay) {
            const next = new Date(fromDate);
            const currentDay = next.getDay();
            let daysUntilReset = (resetDay - currentDay + 7) % 7;
            if (daysUntilReset === 0) {
                daysUntilReset = 7; // 如果今天是重置日，下次重置是下周
            }
            next.setDate(next.getDate() + daysUntilReset);
            next.setHours(0, 0, 0, 0);
            return next;
        }
        
        // 显示全局添加任务弹窗
        function showGlobalAddTask() {
            const overlay = document.getElementById('global-add-overlay');
            const dialog = document.getElementById('global-add-dialog');
            
            if (overlay && dialog) {
                overlay.style.display = 'block';
                dialog.style.display = 'block';
                
                // 设置默认日期为当前时间
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const dateInput = document.getElementById('global-task-date');
                if (dateInput) {
                    dateInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
                }
                
                // 初始化全局颜色选择器
                initGlobalColorPicker();
                
                // 初始化全局重复类型标签选择器
                initGlobalRepeatSelector();
            }
        }
        
        // 初始化全局重复类型标签选择器
        function initGlobalRepeatSelector() {
            const container = document.getElementById('global-repeat-container');
            if (!container || container.children.length > 0) return;
            
            // 存储选中的值
            const selectedRepeats = new Set(['none']); // 默认选中"一次性"
            container.dataset.selected = 'none';
            
            // 创建选项标签
            const repeatOptions = [
                { value: 'none', label: '一次性' },
                { value: 'daily', label: '每日' },
                { value: 'weekly-1', label: '周一' },
                { value: 'weekly-2', label: '周二' },
                { value: 'weekly-3', label: '周三' },
                { value: 'weekly-4', label: '周四' },
                { value: 'weekly-5', label: '周五' },
                { value: 'weekly-6', label: '周六' },
                { value: 'weekly-0', label: '周日' }
            ];
            
            repeatOptions.forEach(opt => {
                const tag = document.createElement('span');
                tag.className = 'repeat-tag';
                tag.dataset.value = opt.value;
                tag.textContent = opt.label;
                const isSelected = opt.value === 'none';
                tag.style.cssText = `
                    padding: 6px 12px;
                    font-size: 12px;
                    border-radius: 4px;
                    cursor: pointer;
                    transition: all 0.2s;
                    user-select: none;
                    background-color: ${isSelected ? '#9C27B0' : 'white'};
                    color: ${isSelected ? 'white' : '#333'};
                    border: ${isSelected ? '1px solid #9C27B0' : '1px solid #ddd'};
                `;
                
                tag.onclick = () => {
                    if (selectedRepeats.has(opt.value)) {
                        // 取消选中（但至少要保留一个选项）
                        if (selectedRepeats.size > 1) {
                            selectedRepeats.delete(opt.value);
                            tag.style.backgroundColor = 'white';
                            tag.style.color = '#333';
                            tag.style.border = '1px solid #ddd';
                        }
                    } else {
                        // 选中
                        selectedRepeats.add(opt.value);
                        tag.style.backgroundColor = '#9C27B0';
                        tag.style.color = 'white';
                        tag.style.border = '1px solid #9C27B0';
                    }
                    // 更新dataset
                    container.dataset.selected = Array.from(selectedRepeats).join(',');
                };
                
                container.appendChild(tag);
            });
        }
        
        // 初始化全局颜色选择器
        function initGlobalColorPicker() {
            const container = document.getElementById('global-color-picker');
            if (!container || container.children.length > 0) return;
            
            const presetColors = [
                '#9C27B0', // 紫色
                '#F44336', // 红色
                '#2196F3', // 蓝色
                '#4CAF50', // 绿色
                '#FF9800', // 橙色
                '#E91E63', // 粉红
                '#00BCD4', // 青色
                '#FFEB3B', // 黄色
                '#795548', // 棕色
                '#607D8B', // 灰蓝
            ];
            
            let selectedColor = '#9C27B0'; // 默认紫色
            
            presetColors.forEach(color => {
                const colorOption = document.createElement('div');
                colorOption.style.cssText = `
                    width: 24px;
                    height: 24px;
                    background-color: ${color};
                    border: 2px solid transparent;
                    border-radius: 3px;
                    cursor: pointer;
                    transition: all 0.2s;
                `;
                if (color === '#9C27B0') {
                    colorOption.style.borderColor = '#333';
                    colorOption.style.boxShadow = '0 0 0 1px white, 0 0 0 2px #333';
                }
                colorOption.onclick = () => {
                    selectedColor = color;
                    // 保存选中的颜色到容器上
                    container.dataset.selectedColor = color;
                    // 更新所有颜色方块的选中状态
                    container.querySelectorAll('div').forEach(opt => {
                        opt.style.borderColor = 'transparent';
                        opt.style.boxShadow = 'none';
                    });
                    colorOption.style.borderColor = '#333';
                    colorOption.style.boxShadow = '0 0 0 1px white, 0 0 0 2px #333';
                };
                container.appendChild(colorOption);
            });
            
            // 保存选中的颜色到容器上，方便后续获取
            container.dataset.selectedColor = selectedColor;
        }
        
        // 隐藏全局添加任务弹窗
        function hideGlobalAddTask() {
            const overlay = document.getElementById('global-add-overlay');
            const dialog = document.getElementById('global-add-dialog');
            
            if (overlay && dialog) {
                overlay.style.display = 'none';
                dialog.style.display = 'none';
            }
        }
        
        // 执行全局添加任务
        function executeGlobalAddTask() {
            const taskNameInput = document.getElementById('global-task-name');
            const colorContainer = document.getElementById('global-color-picker');
            const repeatContainer = document.getElementById('global-repeat-container');
            const dateInput = document.getElementById('global-task-date');
            
            const taskName = taskNameInput.value.trim();
            if (!taskName) {
                showToast('请输入任务名称', 'warning');
                return;
            }
            
            const selectedDate = dateInput.value ? new Date(dateInput.value) : new Date();
            const taskColor = colorContainer ? colorContainer.dataset.selectedColor || '#9C27B0' : '#9C27B0';
            
            // 从标签式选择器获取选中的重复选项
            let selectedRepeats = repeatContainer.dataset.selected.split(',').filter(s => s.trim());
            
            // 如果没有选择任何项，默认使用"一次性"
            if (selectedRepeats.length === 0) {
                selectedRepeats = ['none'];
            }
            
            let totalAdded = 0;
            let serverCount = 0;
            let skippedCount = 0;
            
            // 遍历所有大区
            servers.forEach(server => {
                const rolesToAdd = server.roles.filter(role => role !== '全部');
                
                if (rolesToAdd.length === 0) {
                    return;
                }
                
                // 为每个角色创建任务，将选中的重复类型存储为数组
                rolesToAdd.forEach(role => {
                    // 检查是否已存在相同名称、相同角色的任务（不检查重复类型，因为现在一个任务可以有多个重置日）
                    const existingTask = server.tasks.find(t => 
                        t.text === taskName && 
                        t.role === role
                    );
                    
                    if (existingTask) {
                        // 如果已存在，跳过
                        skippedCount++;
                        return;
                    }
                    
                    const newTask = {
                        id: `task-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
                        text: taskName,
                        repeat: selectedRepeats, // 存储为数组
                        role: role,
                        color: taskColor,
                        completed: false,
                        lastCompleted: null,
                        created: new Date().toISOString(),
                        nextDate: selectedDate.toISOString()
                    };
                    server.tasks.push(newTask);
                    totalAdded++;
                });
                
                serverCount++;
            });
            
            saveServers();
            renderTasks();
            updateDate();
            
            hideGlobalAddTask();
            
            // 显示详细结果
            if (skippedCount > 0) {
                showToast(`已为${serverCount}个大区的${totalAdded}个角色添加任务，跳过${skippedCount}个重复任务`, 'info');
            } else {
                showToast(`已为${serverCount}个大区的${totalAdded}个角色添加任务`, 'success');
            }
            
            // 清空输入框
            taskNameInput.value = '';
        }
        
        // 页面加载时初始化
        window.addEventListener('load', function() {
            checkAndResetRecurringTasks();
            renderServers();
            // 确保DOM创建后再渲染任务
            setTimeout(() => {
                renderTasks();
            }, 0);
        });
    </script>
