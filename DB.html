<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏待办事项列表</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        h1 {
            color: #333;
            text-align: center;
            margin: 0;
            font-size: 20px;
            flex: 1;
        }
        .global-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: nowrap;
        }
        .sound-control {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            white-space: nowrap;
        }
        .sound-control button {
            padding: 2px 6px;
            font-size: 10px;
        }
        .date-info {
            color: #666;
            font-size: 9px;
            white-space: nowrap;
        }
        .data-controls {
            display: flex;
            gap: 3px;
        }
        .data-controls button {
            padding: 2px 6px;
            font-size: 10px;
            white-space: nowrap;
        }
        .servers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 8px;
            flex: 1;
            min-height: 0;
        }
        .server-section {
            background-color: white;
            border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .server-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .server-title {
            font-size: 14px;
            font-weight: bold;
        }
        .server-controls {
            display: flex;
            gap: 5px;
        }
        .server-content {
            padding: 8px;
            flex: 1;
            overflow-y: auto;
            overflow-x: visible; /* 允许横向溢出，确保下拉框不被裁剪 */
            display: flex;
            flex-direction: column;
        }
        .task-list {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            align-content: start;
        }
        .task-group {
            grid-column: 1 / -1;
        }
        .task-item:hover {
            background-color: #e8e8e8;
            border-color: #ccc;
        }
        .task-item {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 3px 5px;
            border-radius: 3px;
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            transition: all 0.2s;
            font-size: 11px;
            height: 24px;
        }
        /* 任务分组样式 - 增强视觉区分度 */
        .task-group {
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%); /* 渐变背景 */
            border: 2px solid #667eea; /* 更明显的边框 */
            border-radius: 6px;
            padding: 8px;
            box-shadow: 0 2px 4px rgba(102, 126, 234, 0.15); /* 轻微阴影 */
        }
        .task-group-header {
            font-weight: bold;
            font-size: 13px;
            color: #fff;
            margin-bottom: 6px;
            padding: 5px 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 4px rgba(102, 126, 234, 0.15);
            position: relative;
            overflow: hidden;
        }
        .task-group-header .group-title {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .task-group-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 6px;
        }
        .grouped-task {
            background-color: white;
            border: 1px solid #d0d0d0;
            border-left: 3px solid #667eea; /* 左侧彩色边框 */
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        input[type="checkbox"] {
            transform: scale(0.85);
            margin: 0;
        }
        .task-content {
            flex: 1;
            font-size: 11px;
            min-width: 0;
            white-space: nowrap;
        }
        .task-controls {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }
        .repeat-badge {
            font-size: 11px;
            padding: 2px 5px;
            border-radius: 6px;
            background-color: #e0e0e0;
        }
        .daily {
            background-color: #bbdefb;
            color: #0d47a1;
        }
        .weekly {
            background-color: #c8e6c9;
            color: #1b5e20;
        }
        .add-task {
            display: flex;
            gap: 5px;
            margin-top: 5px;
            flex-shrink: 0;
            flex-wrap: wrap;
            overflow: visible; /* 确保下拉框不被裁剪 */
        }
        .add-task-row {
            display: contents;
        }
        .add-task-row input[type="text"] {
            flex: 1;
            min-width: 200px;
        }
        /* 任务历史记录下拉框 */
        .task-history-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 1000;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 2px;
        }
        .history-item {
            padding: 6px 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        .history-item:hover {
            background-color: #f5f5f5;
        }
        .history-item:last-child {
            border-bottom: none;
        }
        .history-delete-btn {
            padding: 2px 6px;
            font-size: 10px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            margin-left: 8px;
        }
        .history-delete-btn:hover {
            background-color: #d32f2f;
        }
        .history-clear-all {
            padding: 6px 10px;
            text-align: center;
            color: #666;
            cursor: pointer;
            font-size: 11px;
            border-top: 1px solid #e0e0e0;
            background-color: #fafafa;
        }
        .history-clear-all:hover {
            background-color: #f0f0f0;
            color: #f44336;
        }
        input[type="text"], select, input[type="date"], input[type="datetime-local"] {
            padding: 4px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 11px;
        }
        input[type="date"] {
            width: 150px;
            min-width: 150px;
        }
        input[type="datetime-local"] {
            width: 160px;
            min-width: 160px;
        }
        select {
            min-width: 80px;
            max-width: 150px;
            flex: 1;
        }
        /* 角色选择器 */
        .role-selector {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
            margin-bottom: 3px;
        }
        .role-tag {
            padding: 1px 4px;
            border-radius: 8px;
            font-size: 9px;
            cursor: pointer;
            background-color: #e0e0e0;
            color: #666;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .role-tag.active {
            background-color: #667eea;
            color: white;
        }
        .role-tag:hover {
            opacity: 0.8;
        }
        button {
            padding: 2px 5px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
        .sound-control {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            white-space: nowrap;
        }
        .sound-control button {
            padding: 2px 6px;
            font-size: 10px;
        }
        .date-info {
            color: #666;
            font-size: 9px;
            margin-left: auto; /* 推到右边 */
            white-space: nowrap;
        }
        .delete-btn {
            background-color: #f44336;
            padding: 2px 5px;
            font-size: 9px;
        }
        .delete-btn:hover {
            background-color: #d32f2f;
        }
        /* 颜色选择器下拉列表 */
        .color-picker-dropdown {
            position: absolute;
            bottom: 100%; /* 向上弹出 */
            left: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 99999; /* 提高z-index确保在最上层 */
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-bottom: 5px;
        }
        .color-option {
            width: 24px;
            height: 24px;
            border: 2px solid transparent;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .color-option:hover {
            border-color: #333;
            transform: scale(1.1);
        }
        .color-option.selected {
            border-color: #333;
            box-shadow: 0 0 0 2px white, 0 0 0 4px #333;
        }
        .data-controls {
            display: flex;
            gap: 3px;
            flex-wrap: nowrap;
        }
        .data-controls button {
            padding: 2px 6px;
            font-size: 10px;
            white-space: nowrap;
        }
        .export-btn {
            background-color: #2196F3;
        }
        .export-btn:hover {
            background-color: #1976D2;
        }
        .import-btn {
            background-color: #FF9800;
        }
        .import-btn:hover {
            background-color: #F57C00;
        }
        .clear-btn {
            background-color: #9E9E9E;
        }
        .clear-btn:hover {
            background-color: #757575;
        }
        .add-server-btn {
            background-color: #9C27B0;
        }
        .add-server-btn:hover {
            background-color: #7B1FA2;
        }
        .completed-task {
            text-decoration: line-through !important;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: #fff !important;
            padding: 2px 6px !important;
            border-radius: 3px;
            display: inline-block;
        }
        /* 提示信息样式 */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 4px;
            color: white;
            font-size: 13px;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .toast.show {
            opacity: 1;
        }
        .toast.success {
            background-color: #4CAF50;
        }
        .toast.error {
            background-color: #f44336;
        }
        .toast.warning {
            background-color: #FF9800;
        }
        .toast.info {
            background-color: #2196F3;
        }
        /* 声音设置面板 */
        .sound-settings {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 10001;
            min-width: 300px;
        }
        .sound-settings.show {
            display: block;
        }
        .sound-settings-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10000;
        }
        .sound-settings-overlay.show {
            display: block;
        }
        .sound-settings h3 {
            margin: 0 0 15px 0;
            color: #333;
        }
        .sound-settings label {
            display: block;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .sound-settings input[type="range"] {
            width: 100%;
            margin: 5px 0;
        }
        .sound-settings .value-display {
            text-align: right;
            color: #666;
            font-size: 12px;
        }
        .sound-settings button {
            margin-top: 10px;
            width: 100%;
        }
        .close-settings {
            background-color: #9E9E9E;
        }
        /* 输入框弹窗样式 */
        .input-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 10002;
            min-width: 300px;
        }
        .input-modal.show {
            display: block;
        }
        .input-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10001;
        }
        .input-modal-overlay.show {
            display: block;
        }
        .input-modal h3 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 16px;
        }
        .input-modal input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .input-modal input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .input-modal-buttons button {
            padding: 6px 16px;
        }
        .modal-cancel {
            background-color: #9E9E9E;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题和控制栏在同一行 -->
        <div class="header-row">
            <h1>游戏待办事项列表</h1>
            
            <!-- 全局控制区 -->
            <div class="global-controls">
                <div class="sound-control">
                    <label>
                        <input type="checkbox" id="sound-toggle" checked>
                        启用声音提示
                    </label>
                    <button onclick="testSound()">测试声音</button>
                    <button onclick="showSoundSettings()">声音设置</button>
                </div>
                
                <div class="data-controls">
                    <button class="export-btn" onclick="exportData()">导出</button>
                    <button class="export-btn" onclick="setExportFileNamePrefix()" style="background-color: #2196F3;">导出设置</button>
                    <button class="import-btn" onclick="document.getElementById('import-file').click()">导入</button>
                    <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importData(this)">
                    <button class="clear-btn" onclick="clearAllData()">清空</button>
                    <button class="add-server-btn" onclick="addNewServer()">+ 添加大区</button>
                    <button class="global-add-btn" onclick="showGlobalAddTask()" style="background-color: #9C27B0;">全局添加任务</button>
                </div>
                
                <div class="date-info">
                    最后更新: <span id="last-updated"></span>
                </div>
            </div>
        </div>
        
        <!-- 大区网格布局 -->
        <div class="servers-grid" id="servers-container"></div>
        
        <!-- 声音设置面板 -->
        <div class="sound-settings-overlay" id="sound-overlay" onclick="hideSoundSettings()"></div>
        <div class="sound-settings" id="sound-settings">
            <h3>声音设置</h3>
            
            <label>
                提示音时长（秒）：
                <input type="range" id="sound-duration" min="0.1" max="3" step="0.1" value="0.5" oninput="updateDurationDisplay()">
                <div class="value-display" id="duration-value">0.5秒</div>
            </label>
            
            <label>
                自定义音频文件（可选）：
                <input type="file" id="custom-sound" accept="audio/*" onchange="loadCustomSound(this)">
            </label>
            
            <button onclick="testCustomSound()">测试当前声音</button>
            <button class="close-settings" onclick="hideSoundSettings()">关闭</button>
        </div>
        
        <!-- 全局添加任务弹窗 -->
        <div class="sound-settings-overlay" id="global-add-overlay" onclick="hideGlobalAddTask()"></div>
        <div class="sound-settings" id="global-add-dialog" style="max-width: 500px;">
            <h3>全局添加任务（所有大区）</h3>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">任务名称：</label>
                <input type="text" id="global-task-name" placeholder="输入任务名称..." style="width: 100%; padding: 8px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">标签颜色：</label>
                <div id="global-color-picker" style="display: flex; gap: 5px; flex-wrap: wrap;"></div>
                <span style="font-size: 12px; color: #666; display: block; margin-top: 5px;">点击选择角色和日期标签的颜色</span>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">重复类型：</label>
                <select id="global-task-repeat" style="width: 100%; padding: 8px;">
                    <option value="none">一次性</option>
                    <option value="daily">每日</option>
                    <option value="weekly-1">每周一</option>
                    <option value="weekly-2">每周二</option>
                    <option value="weekly-3">每周三</option>
                    <option value="weekly-4">每周四</option>
                    <option value="weekly-5">每周五</option>
                    <option value="weekly-6">每周六</option>
                    <option value="weekly-0">每周日</option>
                </select>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">任务日期：</label>
                <input type="datetime-local" id="global-task-date" style="width: 100%; padding: 8px;">
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button onclick="hideGlobalAddTask()" style="background-color: #9E9E9E;">取消</button>
                <button onclick="executeGlobalAddTask()" style="background-color: #9C27B0;">确认添加</button>
            </div>
        </div>
        
        <!-- 通用输入框弹窗 -->
        <div class="input-modal-overlay" id="input-modal-overlay" onclick="closeInputModal()"></div>
        <div class="input-modal" id="input-modal">
            <h3 id="input-modal-title">输入</h3>
            <input type="text" id="input-modal-input" placeholder="请输入...">
            <div class="input-modal-buttons">
                <button class="modal-cancel" onclick="closeInputModal()">取消</button>
                <button id="input-modal-confirm" onclick="confirmInputModal()">确定</button>
            </div>
        </div>
    </div>

    <script>
        // 音频上下文用于播放声音
        let audioContext = null;
        let soundEnabled = true;
        let customAudioBuffer = null; // 自定义音频缓冲区
        let soundDuration = 0.5; // 默认时长0.5秒
        
        // Toast提示函数
        function showToast(message, type = 'info', duration = 2000) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            // 显示动画
            setTimeout(() => toast.classList.add('show'), 10);
            
            // 自动隐藏
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => document.body.removeChild(toast), 300);
            }, duration);
        }
        
        // 初始化音频上下文
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        // 播放提示音
        function playNotificationSound() {
            if (!soundEnabled) return;
            
            initAudio();
            
            // 如果有自定义音频，播放自定义音频
            if (customAudioBuffer) {
                const source = audioContext.createBufferSource();
                source.buffer = customAudioBuffer;
                source.connect(audioContext.destination);
                source.start(0);
            } else {
                // 使用默认的合成声音
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + soundDuration);
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + soundDuration);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + soundDuration);
            }
        }
        
        // 测试声音功能
        function testSound() {
            playNotificationSound();
        }
        
        // 显示声音设置面板
        function showSoundSettings() {
            document.getElementById('sound-settings').classList.add('show');
            document.getElementById('sound-overlay').classList.add('show');
        }
        
        // 隐藏声音设置面板
        function hideSoundSettings() {
            document.getElementById('sound-settings').classList.remove('show');
            document.getElementById('sound-overlay').classList.remove('show');
        }
        
        // 更新时长显示
        function updateDurationDisplay() {
            const durationInput = document.getElementById('sound-duration');
            soundDuration = parseFloat(durationInput.value);
            document.getElementById('duration-value').textContent = soundDuration.toFixed(1) + '秒';
            localStorage.setItem('todoSoundDuration', soundDuration);
        }
        
        // 加载自定义音频文件
        function loadCustomSound(inputElement) {
            const file = inputElement.files[0];
            if (!file) return;
            
            initAudio();
            
            const reader = new FileReader();
            reader.onload = function(e) {

                '#E91E63', // 粉红
                '#00BCD4', // 青色

        // 切换大区折叠状态（已移除）
        // function toggleServerCollapse(serverId) { ... }
        
        // 选择角色
        function selectRole(serverId, role) {
            currentRoles[serverId] = role;
            renderServers();
            renderTasks();
        }
        
        // 编辑角色名称
        function editRoleName(serverId, roleIndex, roleTag) {
            const server = servers.find(s => s.id === serverId);
            if (!server || roleIndex === 0) {
                console.log('不能编辑全部角色');
                return; // 不能编辑“全部”
            }
            
            console.log('开始编辑角色:', server.roles[roleIndex]);
            
            const oldName = server.roles[roleIndex];
            
            // 将标签转换为输入框
            const input = document.createElement('input');
            input.type = 'text';
            input.value = oldName;
            input.className = 'role-tag';
            input.style.cssText = `
                border: 1px solid #667eea;
                border-radius: 10px;
                padding: 2px 6px;
                font-size: 10px;
                width: 80px;
                outline: none;
                background-color: white;
                color: #333;
            `;
            
            roleTag.replaceWith(input);
            
            // 延迟聚焦确保DOM已更新
            setTimeout(() => {
                input.focus();
                input.select();
            }, 10);
            
            // 保存新名称
            const saveName = () => {
                const newName = input.value.trim();
                console.log('保存角色名称:', newName);
                
                if (newName && newName !== oldName) {
                    // 更新所有使用该角色的任务
                    server.tasks.forEach(task => {
                        if (task.role === oldName) {
                            task.role = newName;
                        }
                    });
                    
                    server.roles[roleIndex] = newName;
                    saveServers();
                    showToast('角色名称已更新', 'success');
                } else if (!newName) {
                    showToast('角色名称不能为空', 'warning');
                }
                renderServers();
                renderTasks();
            };
            
            // 失焦或回车时保存
            input.addEventListener('blur', saveName);
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    input.blur();
                }
            });
            
            // ESC取消
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    input.value = oldName;
                    input.blur();
                }
            });
        }
        
        // 编辑大区名称
        function editServerName(serverId, titleElement) {
            const server = servers.find(s => s.id === serverId);
            if (!server) return;
            
            const oldName = server.name;
            
            // 将标题转换为输入框
            const input = document.createElement('input');
            input.type = 'text';
            input.value = oldName;
            input.style.cssText = `
                background: transparent;
                border: 1px solid white;
                border-radius: 3px;
                padding: 2px 5px;
                font-size: 14px;
                font-weight: bold;
                color: white;
                width: 150px;
                outline: none;
            `;
            
            titleElement.replaceWith(input);
            input.focus();
            input.select();
            
            // 保存新名称
            const saveName = () => {
                const newName = input.value.trim();
                if (newName && newName !== oldName) {
                    server.name = newName;
                    saveServers();
                    showToast('大区名称已更新', 'success');
                }
                renderServers();
            };
            
            // 失焦或回车时保存
            input.addEventListener('blur', saveName);
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    input.blur();
                }
            });
        }
        
        // 添加角色
        function addRole(serverId) {
            const server = servers.find(s => s.id === serverId);
            if (server) {
                // 创建默认名称的角色
                const defaultName = `角色${server.roles.length}`;
                server.roles.push(defaultName);
                saveServers();
                renderServers();
                showToast('新角色已创建，双击角色名称可编辑', 'info');
            }
        }
                
        // 删除角色
        function deleteRole(serverId) {
            const server = servers.find(s => s.id === serverId);
            if (!server || server.roles.length <= 1) {
                showToast('至少需要保留一个角色', 'warning');
                return;
            }
                    
            // 删除最后一个角色（除了"全部"）
            const removedRole = server.roles.pop();
                    
            // 删除该角色下的所有任务
            server.tasks = server.tasks.filter(task => task.role !== removedRole);
                    
            // 如果当前选中的是被删除的角色，切换到"全部"
            if (currentRoles[serverId] === removedRole) {
                currentRoles[serverId] = '全部';
            }
                    
            saveServers();
            renderServers();
            renderTasks();
            showToast(`角色 "${removedRole}" 及其任务已删除`, 'info');
        }
        
        // 添加新大区
        function addNewServer() {
            if (servers.length >= 4) {
                showToast('最多只能创建4个大区！', 'warning');
                return;
            }
            
            // 创建默认名称的大区
            const defaultName = `新区${servers.length + 1}`;
            const newServer = {
                id: `server-${Date.now()}`,
                name: defaultName,
                tasks: [],
                collapsed: false,
                roles: ['全部']
            };
            servers.push(newServer);
            saveServers();
            renderServers();
            showToast('新大区已创建，双击大区名称可编辑', 'info');
        }
        
        // 删除大区
        function deleteServer(serverId) {
            if (servers.length <= 1) {
                showToast('至少需要保留一个大区！', 'warning');
                return;
            }
            
            const server = servers.find(s => s.id === serverId);
            if (!server) return;
            
            const index = servers.findIndex(s => s.id === serverId);
            if (index !== -1) {
                servers.splice(index, 1);
                saveServers();
                renderServers();
                showToast(`大区 "${server.name}" 已删除`, 'info');
            }
        }
        
        // 向指定大区添加任务
        function addTaskToServer(serverId) {
            // 防止重复添加
            if (isAddingTask) {
                console.log('正在添加中，忽略本次请求');
                return;
            }
            isAddingTask = true;
                            
            const taskInput = document.getElementById(`input-${serverId}`);
            const dateInput = document.getElementById(`date-${serverId}`);
            const repeatSelect = document.getElementById(`repeat-${serverId}`);
            const roleSelect = document.getElementById(`role-${serverId}`);
            const taskText = taskInput.value.trim();
                            
            console.log('添加任务:', taskText, '大区ID:', serverId);
                            
            if (taskText) {
                // 保存到历史记录
                addToTaskHistory(taskText);
                                
                const server = servers.find(s => s.id === serverId);
                if (server) {
                    console.log('当前任务数量:', server.tasks.length);
                                    
                    // 从日期输入框获取日期
                    const selectedDate = dateInput.value ? new Date(dateInput.value) : new Date();
                                    
                    // 获取选择的颜色（从颜色选择器的 dataset 获取）
                    const addTaskRow = dateInput.closest('.add-task-row');
                    let taskColor = '#9C27B0';
                    if (addTaskRow) {
                        const colorWrapper = addTaskRow.querySelector('div[data-selected-color]');
                        if (colorWrapper && colorWrapper.dataset.selectedColor) {
                            taskColor = colorWrapper.dataset.selectedColor;
                        }
                    }
                                    
                    // 检查是否选择“全部角色”
                    const selectedRole = roleSelect.value;
                                    
                    if (selectedRole === '__all__') {
                        // 为每个角色创建任务副本（除了“全部”）
                        const rolesToAdd = server.roles.filter(role => role !== '全部');
                                                            
                        if (rolesToAdd.length === 0) {
                            showToast('没有可添加的角色', 'warning');
                            isAddingTask = false;
                            return;
                        }
                                                            
                        let addedCount = 0;
                        rolesToAdd.forEach(role => {
                            const newTask = {
                                id: `task-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
                                text: taskText,
                                repeat: repeatSelect.value,
                                role: role,
                                color: taskColor,
                                completed: false,
                                lastCompleted: null,
                                created: new Date().toISOString(),
                                nextDate: selectedDate.toISOString()
                            };
                            server.tasks.push(newTask);
                            addedCount++;
                        });
                                                            
                        console.log(`已为${addedCount}个角色添加任务`);
                        showToast(`已为${addedCount}个角色添加任务`, 'success');
                    } else {
                        // 为单个角色添加任务
                        const newTask = {
                            id: `task-${Date.now()}`,
                            text: taskText,
                            repeat: repeatSelect.value,
                            role: selectedRole,
                            color: taskColor,
                            completed: false,
                            lastCompleted: null,
                            created: new Date().toISOString(),
                            nextDate: selectedDate.toISOString()
                        };
                        
                        server.tasks.push(newTask);
                        console.log('添加后任务数量:', server.tasks.length);
                        showToast('任务已添加', 'success');
                    }
                    
                    saveServers();
                    renderTasks();
                    
                    // 清空输入框并失焦
                    taskInput.value = '';
                    taskInput.blur();
                    
                    // 更新日期选择器为当前时间
                    const now = new Date();
                    const year = now.getFullYear();
                    const month = String(now.getMonth() + 1).padStart(2, '0');
                    const day = String(now.getDate()).padStart(2, '0');
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    dateInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
                    
                    // 更新最后更新时间
                    updateDate();
                }
            }
            
            // 重置标志，允许下次添加
            setTimeout(() => {
                isAddingTask = false;
                console.log('添加标志已重置');
            }, 300);
        }
        
        // 切换任务完成状态
        function toggleTaskCompletion(serverId, taskId) {
            const server = servers.find(s => s.id === serverId);
            if (!server) return;
            
            const task = server.tasks.find(t => t.id === taskId);
            if (!task) return;
            
            const today = new Date().toDateString();
            
            if (task.completed && task.lastCompleted === today) {
                task.completed = false;
                task.lastCompleted = null;
            } else {
                task.completed = true;
                task.lastCompleted = today;
                
                // 更新下次完成日期
                if (task.repeat === 'daily') {
                    const tomorrow = new Date();
                    tomorrow.setDate(tomorrow.getDate() + 1);
                    task.nextDate = tomorrow.toISOString();
                } else if (task.repeat && task.repeat.startsWith('weekly-')) {
                    // 自定义每周重置日
                    const resetDay = parseInt(task.repeat.split('-')[1]);
                    const nextReset = new Date();
                    const currentDay = nextReset.getDay();
                    
                    // 计算距离下一个重置日还有几天
                    let daysUntilReset = (resetDay - currentDay + 7) % 7;
                    if (daysUntilReset === 0) {
                        daysUntilReset = 7; // 如果是同一天，就设置为7天后
                    }
                    
                    nextReset.setDate(nextReset.getDate() + daysUntilReset);
                    task.nextDate = nextReset.toISOString();
                } else if (task.repeat === 'none') {
                    // 一次性任务：检查同组的所有一次性任务是否都完成了
                    const sameGroupTasks = server.tasks.filter(t => 
                        t.text === task.text && 
                        t.repeat === 'none'
                    );
                    
                    const allCompleted = sameGroupTasks.every(t => 
                        t.completed && t.lastCompleted === today
                    );
                    
                    if (allCompleted && sameGroupTasks.length > 0) {
                        // 同组的所有一次性任务都完成了，删除整个分组
                        sameGroupTasks.forEach(t => {
                            const index = server.tasks.findIndex(task => task.id === t.id);
                            if (index !== -1) {
                                server.tasks.splice(index, 1);
                            }
                        });
                        showToast('所有一次性任务已完成，分组已删除', 'info');
                        saveServers();
                        renderTasks();
                        updateDate();
                        return;
                    }
                }
            }
            
            saveServers();
            renderTasks();
            updateDate();
        }
        
        // 更新任务文本
        function updateTaskText(serverId, taskId, newText) {
            const server = servers.find(s => s.id === serverId);
            if (!server) return;
            
            const task = server.tasks.find(t => t.id === taskId);
            if (task) {
                task.text = newText.trim();
                saveServers();
            }
        }
        
        // 删除任务
        function deleteTask(serverId, taskId) {
            const server = servers.find(s => s.id === serverId);
            if (!server) return;
            
            const task = server.tasks.find(t => t.id === taskId);
            if (!task) return;
            
            console.log('删除前任务数量:', server.tasks.length);
            const index = server.tasks.findIndex(t => t.id === taskId);
            if (index !== -1) {
                server.tasks.splice(index, 1);
                console.log('删除后任务数量:', server.tasks.length);
                saveServers();
                renderTasks();
                updateDate();
                showToast('任务已删除', 'info');
            }
        }
        
        // 删除整个任务分组（所有角色的同名任务）
        function deleteTaskGroup(serverId, taskName) {
            const server = servers.find(s => s.id === serverId);
            if (!server) return;
            
            // 过滤掉所有匹配任务名的任务
            const beforeCount = server.tasks.length;
            server.tasks = server.tasks.filter(task => task.text !== taskName);
            const afterCount = server.tasks.length;
            const deletedCount = beforeCount - afterCount;
            
            if (deletedCount > 0) {
                saveServers();
                renderTasks();
                updateDate();
                showToast(`已删除${deletedCount}个“${taskName}”任务`, 'info');
            }
        }
        
        // 渲染任务列表
        function renderTasks() {
            servers.forEach(server => {
                const listElement = document.getElementById(`list-${server.id}`);
                if (!listElement) return;
                
                listElement.innerHTML = '';
                
                // 根据当前选中的角色过滤任务
                const selectedRole = currentRoles[server.id] || '全部';
                let filteredTasks = selectedRole === '全部' 
                    ? server.tasks 
                    : server.tasks.filter(task => task.role === selectedRole);
                
                // 按任务名分组
                const taskGroups = {};
                filteredTasks.forEach(task => {
                    if (!taskGroups[task.text]) {
                        taskGroups[task.text] = [];
                    }
                    taskGroups[task.text].push(task);
                });
                
                // 渲染每个任务组
                Object.keys(taskGroups).forEach(taskName => {
                    const group = taskGroups[taskName];
                    
                    // 如果组内没有任务，跳过（自动删除空分组）
                    if (group.length === 0) {
                        return;
                    }
                    
                    // 如果组内有多个任务（批量添加的），创建组容器
                    if (group.length > 1) {
                        const groupContainer = document.createElement('div');
                        groupContainer.className = 'task-group';
                        
                        // 组标题（带删除按钮和颜色选择器）
                        const groupHeader = document.createElement('div');
                        groupHeader.className = 'task-group-header';
                        
                        // 标题文字部分
                        const titleDiv = document.createElement('div');
                        titleDiv.className = 'group-title';
                        
                        // 从任务组获取颜色（使用第一个任务的颜色）
                        let groupColor = group[0].color || '#667eea';
                        groupHeader.style.background = `linear-gradient(135deg, ${groupColor} 0%, ${groupColor}dd 100%)`;
                        
                        const headerText = document.createElement('span');
                        headerText.textContent = taskName;
                        headerText.style.fontWeight = 'bold';
                        
                        titleDiv.appendChild(headerText);
                        
                        const deleteGroupBtn = document.createElement('button');
                        deleteGroupBtn.textContent = '删除全部';
                        deleteGroupBtn.style.cssText = `
                            padding: 3px 10px;
                            font-size: 10px;
                            background-color: rgba(255,255,255,0.2);
                            color: white;
                            border: 1px solid rgba(255,255,255,0.5);
                            border-radius: 3px;
                            cursor: pointer;
                            margin-left: 10px;
                            transition: all 0.2s;
                        `;
                        deleteGroupBtn.onmouseover = () => {
                            deleteGroupBtn.style.backgroundColor = 'rgba(255,255,255,0.3)';
                        };
                        deleteGroupBtn.onmouseout = () => {
                            deleteGroupBtn.style.backgroundColor = 'rgba(255,255,255,0.2)';
                        };
                        deleteGroupBtn.onclick = (e) => {
                            e.stopPropagation();
                            deleteTaskGroup(server.id, taskName);
                        };
                        
                        // 颜色选择器（小色块）
                        const colorPicker = document.createElement('div');
                        colorPicker.style.cssText = `
                            display: flex;
                            gap: 3px;
                            margin-left: 8px;
                        `;
                        
                        const presetColors = [
                            '#667eea', // 蓝紫（柔和）
                            '#e57373', // 红色（柔和）
                            '#81c784', // 绿色（柔和）
                            '#ffb74d', // 橙色（柔和）
                            '#f06292', // 粉红（柔和）
                            '#ba68c8', // 紫色（柔和）
                            '#64b5f6', // 蓝色（柔和）
                            '#4dd0e1', // 青色（柔和）
                        ];
                        
                        presetColors.forEach(color => {
                            const colorDot = document.createElement('div');
                            colorDot.style.cssText = `
                                width: 14px;
                                height: 14px;
                                background-color: ${color};
                                border: 2px solid ${color === groupColor ? '#fff' : 'transparent'};
                                border-radius: 3px;
                                cursor: pointer;
                                transition: all 0.2s;
                            `;
                            colorDot.onmouseover = () => {
                                if (color !== groupColor) {
                                    colorDot.style.transform = 'scale(1.2)';
                                    colorDot.style.boxShadow = '0 2px 6px rgba(0,0,0,0.3)';
                                }
                            };
                            colorDot.onmouseout = () => {
                                if (color !== groupColor) {
                                    colorDot.style.transform = 'scale(1)';
                                    colorDot.style.boxShadow = 'none';
                                }
                            };
                            colorDot.onclick = (e) => {
                                e.stopPropagation();
                                // 更新所有同组任务的颜色
                                group.forEach(task => {
                                    task.color = color;
                                });
                                saveServers();
                                // 更新标题背景
                                groupHeader.style.background = `linear-gradient(135deg, ${color} 0%, ${color}dd 100%)`;
                                // 更新选中状态
                                colorPicker.querySelectorAll('div').forEach(dot => {
                                    dot.style.borderColor = 'transparent';
                                });
                                colorDot.style.borderColor = '#fff';
                            };
                            colorPicker.appendChild(colorDot);
                        });
                        
                        titleDiv.appendChild(colorPicker);
                        groupHeader.appendChild(titleDiv);
                        groupHeader.appendChild(deleteGroupBtn);
                        groupContainer.appendChild(groupHeader);
                        
                        // 任务网格
                        const groupGrid = document.createElement('div');
                        groupGrid.className = 'task-group-grid';
                        
                        group.forEach(task => {
                            const taskElement = createTaskElement(server.id, task);
                            taskElement.classList.add('grouped-task');
                            groupGrid.appendChild(taskElement);
                        });
                        
                        groupContainer.appendChild(groupGrid);
                        listElement.appendChild(groupContainer);
                    } else {
                        // 单个任务直接添加
                        const taskElement = createTaskElement(server.id, group[0]);
                        listElement.appendChild(taskElement);
                    }
                });
            });
        }
        
        // 创建任务元素
        function createTaskElement(serverId, task) {
            const div = document.createElement('div');
            div.className = 'task-item';
                            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = task.completed && task.lastCompleted === new Date().toDateString();
            checkbox.addEventListener('change', () => toggleTaskCompletion(serverId, task.id));
                            
            const controls = document.createElement('div');
            controls.className = 'task-controls';
            controls.style.flex = '1'; // 让 controls 占据剩余空间
                            
            // 角色标签（如果不是"全部"）
            if (task.role && task.role !== '全部') {
                const roleBadge = document.createElement('span');
                roleBadge.className = 'repeat-badge';
                // 使用任务的自定义颜色
                const roleColor = task.color || '#9C27B0';
                roleBadge.style.backgroundColor = roleColor;
                roleBadge.style.color = '#fff'; // 白色文字
                roleBadge.textContent = task.role;
                roleBadge.style.cursor = 'pointer'; // 添加指针样式
                roleBadge.title = '点击切换完成状态'; // 添加提示
                // 如果任务完成，添加删除线
                if (task.completed && task.lastCompleted === new Date().toDateString()) {
                    roleBadge.classList.add('completed-task');
                }
                // 点击角色标签也可以切换完成状态
                roleBadge.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleTaskCompletion(serverId, task.id);
                });
                controls.appendChild(roleBadge);
            }
                                        
            // 日期显示
            const dateBadge = document.createElement('span');
            dateBadge.className = 'repeat-badge';
            dateBadge.style.cursor = 'pointer'; // 添加指针样式
            dateBadge.title = '点击切换完成状态'; // 添加提示
                                        
            const nextDate = new Date(task.nextDate);
            const today = new Date();
                                        
            if (task.repeat === 'daily') {
                dateBadge.textContent = '每日';
                // 使用任务的自定义颜色
                const dateColor = task.color || '#9C27B0';
                dateBadge.style.backgroundColor = dateColor;
                dateBadge.style.color = '#fff';
            } else if (task.repeat && task.repeat.startsWith('weekly-')) {
                // 显示自定义的每周重置日
                const dayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                const resetDay = parseInt(task.repeat.split('-')[1]);
                dateBadge.textContent = '每' + dayNames[resetDay];
                // 使用任务的自定义颜色
                const dateColor = task.color || '#9C27B0';
                dateBadge.style.backgroundColor = dateColor;
                dateBadge.style.color = '#fff';
            } else {
                // 一次性任务，显示具体日期和时间
                const month = nextDate.getMonth() + 1;
                const day = nextDate.getDate();
                const hours = String(nextDate.getHours()).padStart(2, '0');
                const minutes = String(nextDate.getMinutes()).padStart(2, '0');
                dateBadge.textContent = `${month}/${day} ${hours}:${minutes}`;
                // 使用任务的自定义颜色
                const dateColor = task.color || '#9C27B0';
                dateBadge.style.backgroundColor = dateColor;
                dateBadge.style.color = '#fff';
                                    
                // 如果是一次性任务且已过期，显示红色
                if (nextDate < today && !task.completed) {
                    dateBadge.style.backgroundColor = '#ffcdd2'; // 红色
                    dateBadge.style.color = '#c62828';
                }
            }
            // 如果任务完成，添加删除线
            if (task.completed && task.lastCompleted === new Date().toDateString()) {
                dateBadge.classList.add('completed-task');
            }
            // 点击日期标签也可以切换完成状态
            dateBadge.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleTaskCompletion(serverId, task.id);
            });
            controls.appendChild(dateBadge);
                            
            // 删除按钮
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = '×';
            deleteBtn.addEventListener('click', () => deleteTask(serverId, task.id));
            controls.appendChild(deleteBtn);
                            
            div.appendChild(checkbox);
            div.appendChild(controls);
                            
            return div;
        }
        
        // 保存大区数据到localStorage
        function saveServers() {
            localStorage.setItem('gameTodoServers', JSON.stringify(servers));
        }
        
        // 获取任务历史记录
        function getTaskHistory() {
            const history = localStorage.getItem('taskInputHistory');
            return history ? JSON.parse(history) : [];
        }
        
        // 保存任务历史记录
        function saveTaskHistory(history) {
            localStorage.setItem('taskInputHistory', JSON.stringify(history));
        }
        
        // 添加任务到历史记录
        function addToTaskHistory(taskText) {
            if (!taskText || !taskText.trim()) return;
            
            console.log('保存任务到历史记录:', taskText);
            
            let history = getTaskHistory();
            console.log('当前历史记录数量:', history.length);
            
            // 如果已存在，先移除
            history = history.filter(item => item !== taskText.trim());
            
            // 添加到开头
            history.unshift(taskText.trim());
            
            // 只保留最近20条
            if (history.length > 20) {
                history = history.slice(0, 20);
            }
            
            saveTaskHistory(history);
            console.log('保存后历史记录数量:', history.length);
        }
        
        // 显示任务历史记录
        function showTaskHistory(serverId) {
            const dropdown = document.getElementById(`history-${serverId}`);
            if (!dropdown) {
                console.log('未找到下拉框元素:', `history-${serverId}`);
                return;
            }
            
            const history = getTaskHistory();
            console.log('显示历史记录，数量:', history.length);
            
            if (history.length === 0) {
                console.log('历史记录为空，隐藏下拉框');
                dropdown.style.display = 'none';
                return;
            }
            
            dropdown.innerHTML = '';
            
            // 添加历史记录项
            history.forEach(taskText => {
                const item = document.createElement('div');
                item.className = 'history-item';
                
                const textSpan = document.createElement('span');
                textSpan.textContent = taskText;
                textSpan.style.flex = '1';
                textSpan.onclick = () => {
                    const input = document.getElementById(`input-${serverId}`);
                    if (input) {
                        input.value = taskText;
                        dropdown.style.display = 'none';
                    }
                };
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'history-delete-btn';
                deleteBtn.textContent = '删除';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteTaskHistoryItem(taskText);
                    showTaskHistory(serverId);
                };
                
                item.appendChild(textSpan);
                item.appendChild(deleteBtn);
                dropdown.appendChild(item);
            });
            
            // 添加清空全部按钮
            const clearAll = document.createElement('div');
            clearAll.className = 'history-clear-all';
            clearAll.textContent = '清空全部记录';
            clearAll.onclick = () => {
                clearAllTaskHistory();
                dropdown.style.display = 'none';
            };
            dropdown.appendChild(clearAll);
            
            // 使用fixed定位，相对于视口，不受父容器overflow影响
            const input = document.getElementById(`input-${serverId}`);
            if (input) {
                const rect = input.getBoundingClientRect();
                const viewportHeight = window.innerHeight;
                const dropdownHeight = 200; // 预估下拉框高度
                
                dropdown.style.display = 'block';
                dropdown.style.position = 'fixed';
                dropdown.style.left = rect.left + 'px';
                dropdown.style.width = rect.width + 'px';
                dropdown.style.zIndex = '99999';
                
                // 判断下拉框应该显示在输入框上方还是下方
                const spaceBelow = viewportHeight - rect.bottom;
                const spaceAbove = rect.top;
                
                if (spaceBelow < dropdownHeight && spaceAbove > spaceBelow) {
                    // 下方空间不足，上方空间足够，显示在上方
                    dropdown.style.top = (rect.top - dropdownHeight - 2) + 'px';
                    dropdown.style.bottom = 'auto';
                    console.log('下拉框显示在输入框上方');
                } else {
                    // 默认显示在下方
                    dropdown.style.top = (rect.bottom + 2) + 'px';
                    dropdown.style.bottom = 'auto';
                    console.log('下拉框显示在输入框下方');
                }
                
                console.log('下拉框定位:', {
                    top: dropdown.style.top,
                    left: dropdown.style.left,
                    width: dropdown.style.width,
                    spaceBelow: spaceBelow,
                    spaceAbove: spaceAbove
                });
            }
        }
        
        // 删除单条历史记录
        function deleteTaskHistoryItem(taskText) {
            let history = getTaskHistory();
            history = history.filter(item => item !== taskText);
            saveTaskHistory(history);
        }
        
        // 清空全部历史记录
        function clearAllTaskHistory() {
            saveTaskHistory([]);
            showToast('历史记录已清空', 'info');
        }
        
        // 导出数据功能
        function exportData() {
            const data = {
                servers: servers,
                soundEnabled: soundEnabled,
                soundDuration: soundDuration,
                exportDate: new Date().toISOString(),
                version: '2.0'
            };
            
            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            
            // 获取或初始化导出计数
            let exportCount = parseInt(localStorage.getItem('exportCount') || '0');
            exportCount++;
            localStorage.setItem('exportCount', exportCount.toString());
            
            // 获取自定义文件名前缀（如果没有设置则使用默认值）
            let fileNamePrefix = localStorage.getItem('exportFileNamePrefix') || '游戏待办备份';
            
            // 构建文件名：前缀_序号_日期.json
            const dateStr = new Date().toISOString().split('T')[0].replace(/-/g, '');
            const fileName = `${fileNamePrefix}_${String(exportCount).padStart(3, '0')}_${dateStr}.json`;
            
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            showToast(`数据已导出：${fileName}`, 'success');
        }
        
        // 设置导出文件名前缀
        function setExportFileNamePrefix() {
            const currentPrefix = localStorage.getItem('exportFileNamePrefix') || '游戏待办备份';
            const newPrefix = prompt('设置导出文件名前缀（默认为“游戏待办备份”）：\n\n文件名格式：前缀_序号_日期.json', currentPrefix);
            
            if (newPrefix !== null && newPrefix.trim() !== '') {
                localStorage.setItem('exportFileNamePrefix', newPrefix.trim());
                showToast(`已设置文件名前缀：${newPrefix.trim()}`, 'success');
            }
        }
        
        // 重置导出计数
        function resetExportCount() {
            if (confirm('确定要重置导出计数吗？\n\n当前计数：' + (localStorage.getItem('exportCount') || '0'))) {
                localStorage.setItem('exportCount', '0');
                showToast('导出计数已重置', 'info');
            }
        }
        
        // 导入数据功能
        function importData(inputElement) {
            const file = inputElement.files[0];
            if (!file) {
                showToast('请选择要导入的文件', 'warning');
                return;
            }
            
            console.log('导入文件:', file.name, '大小:', file.size, 'bytes');
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const fileContent = e.target.result;
                    console.log('文件内容长度:', fileContent.length);
                    console.log('文件内容预览:', fileContent.substring(0, 200));
                    
                    const importedData = JSON.parse(fileContent);
                    console.log('解析后的数据:', importedData);
                    
                    // 验证数据格式
                    if (!importedData.servers || !Array.isArray(importedData.servers)) {
                        console.error('数据格式错误:', importedData);
                        throw new Error('无效的数据格式，必须包含 servers 数组');
                    }
                    
                    if (importedData.servers.length === 0) {
                        throw new Error('数据为空，没有大区数据');
                    }
                    
                    console.log('导入的大区数量:', importedData.servers.length);
                    
                    servers = importedData.servers;
                    
                    // 导入声音设置（如果存在）
                    if (importedData.soundEnabled !== undefined) {
                        soundEnabled = importedData.soundEnabled;
                        document.getElementById('sound-toggle').checked = soundEnabled;
                        localStorage.setItem('todoSoundEnabled', soundEnabled);
                    }
                    
                    // 导入声音时长设置（如果存在）
                    if (importedData.soundDuration !== undefined) {
                        soundDuration = importedData.soundDuration;
                        const durationInput = document.getElementById('sound-duration');
                        const durationValue = document.getElementById('duration-value');
                        if (durationInput) durationInput.value = soundDuration;
                        if (durationValue) durationValue.textContent = soundDuration.toFixed(1) + '秒';
                        localStorage.setItem('todoSoundDuration', soundDuration);
                    }
                    
                    saveServers();
                    renderServers();
                    
                    // 确保DOM创建后再渲染任务
                    setTimeout(() => {
                        renderTasks();
                    }, 0);
                    
                    updateDate();
                    
                    const totalTasks = servers.reduce((sum, server) => sum + server.tasks.length, 0);
                    showToast(`数据导入成功！${servers.length}个大区，${totalTasks}个任务`, 'success');
                    console.log('导入完成，当前大区数量:', servers.length);
                } catch (error) {
                    console.error('导入失败:', error);
                    showToast('导入失败：' + error.message, 'error');
                }
            };
            
            reader.onerror = function(e) {
                console.error('文件读取失败:', e);
                showToast('文件读取失败', 'error');
            };
            
            reader.readAsText(file);
            
            // 重置文件输入框，以便可以重复导入同一文件
            inputElement.value = '';
        }
        
        // 清空所有数据功能
        function clearAllData() {
            servers = [
                {
                    id: 'server-1',
                    name: '默认大区',
                    tasks: [],
                    collapsed: false,
                    roles: ['全部']
                }
            ];
            currentRoles = {};
            saveServers();
            renderServers();
            updateDate();
            showToast('所有数据已清空！', 'info');
        }
        
        // 检查重复任务并重置（每天执行）
        function checkAndResetRecurringTasks() {
            const today = new Date().toDateString();
            const todayDay = new Date().getDay(); // 今天是星期几
            const lastCheck = localStorage.getItem('lastRecurringCheck');
            
            // 如果上次检查不是今天，则重置重复任务
            if (lastCheck !== today) {
                let changed = false;
                
                servers.forEach(server => {
                    server.tasks.forEach(task => {
                        if (task.repeat !== 'none' && task.completed) {
                            // 对于每日重复任务，每天都重置
                            if (task.repeat === 'daily') {
                                task.completed = false;
                                task.lastCompleted = null;
                                // 更新下次日期为明天
                                const tomorrow = new Date();
                                tomorrow.setDate(tomorrow.getDate() + 1);
                                task.nextDate = tomorrow.toISOString();
                                changed = true;
                            }
                            // 对于自定义每周重复任务，检查今天是否是重置日
                            else if (task.repeat && task.repeat.startsWith('weekly-')) {
                                const resetDay = parseInt(task.repeat.split('-')[1]);
                                
                                // 如果今天是重置日，则重置任务
                                if (todayDay === resetDay) {
                                    task.completed = false;
                                    task.lastCompleted = null;
                                    // 更新下次日期为下周的同一天
                                    const nextWeek = new Date();
                                    nextWeek.setDate(nextWeek.getDate() + 7);
                                    task.nextDate = nextWeek.toISOString();
                                    changed = true;
                                }
                            }
                        }
                    });
                });
                
                if (changed) {
                    saveServers();
                    // 不在这里调用 renderTasks()，等 DOM 创建后再统一渲染
                }
                
                // 更新最后检查日期
                localStorage.setItem('lastRecurringCheck', today);
            }
        }
        
        // 显示全局添加任务弹窗
        function showGlobalAddTask() {
            const overlay = document.getElementById('global-add-overlay');
            const dialog = document.getElementById('global-add-dialog');
            
            if (overlay && dialog) {
                overlay.style.display = 'block';
                dialog.style.display = 'block';
                
                // 设置默认日期为当前时间
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const dateInput = document.getElementById('global-task-date');
                if (dateInput) {
                    dateInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
                }
                
                // 初始化全局颜色选择器
                initGlobalColorPicker();
            }
        }
        
        // 初始化全局颜色选择器
        function initGlobalColorPicker() {
            const container = document.getElementById('global-color-picker');
            if (!container || container.children.length > 0) return;
            
            const presetColors = [
                '#9C27B0', // 紫色
                '#F44336', // 红色
                '#2196F3', // 蓝色
                '#4CAF50', // 绿色
                '#FF9800', // 橙色
                '#E91E63', // 粉红
                '#00BCD4', // 青色
                '#FFEB3B', // 黄色
                '#795548', // 棕色
                '#607D8B', // 灰蓝
            ];
            
            let selectedColor = '#9C27B0'; // 默认紫色
            
            presetColors.forEach(color => {
                const colorOption = document.createElement('div');
                colorOption.style.cssText = `
                    width: 24px;
                    height: 24px;
                    background-color: ${color};
                    border: 2px solid transparent;
                    border-radius: 3px;
                    cursor: pointer;
                    transition: all 0.2s;
                `;
                if (color === '#9C27B0') {
                    colorOption.style.borderColor = '#333';
                    colorOption.style.boxShadow = '0 0 0 1px white, 0 0 0 2px #333';
                }
                colorOption.onclick = () => {
                    selectedColor = color;
                    // 保存选中的颜色到容器上
                    container.dataset.selectedColor = color;
                    // 更新所有颜色方块的选中状态
                    container.querySelectorAll('div').forEach(opt => {
                        opt.style.borderColor = 'transparent';
                        opt.style.boxShadow = 'none';
                    });
                    colorOption.style.borderColor = '#333';
                    colorOption.style.boxShadow = '0 0 0 1px white, 0 0 0 2px #333';
                };
                container.appendChild(colorOption);
            });
            
            // 保存选中的颜色到容器上，方便后续获取
            container.dataset.selectedColor = selectedColor;
        }
        
        // 隐藏全局添加任务弹窗
        function hideGlobalAddTask() {
            const overlay = document.getElementById('global-add-overlay');
            const dialog = document.getElementById('global-add-dialog');
            
            if (overlay && dialog) {
                overlay.style.display = 'none';
                dialog.style.display = 'none';
            }
        }
        
        // 执行全局添加任务
        function executeGlobalAddTask() {
            const taskNameInput = document.getElementById('global-task-name');
            const colorContainer = document.getElementById('global-color-picker');
            const repeatSelect = document.getElementById('global-task-repeat');
            const dateInput = document.getElementById('global-task-date');
            
            const taskName = taskNameInput.value.trim();
            if (!taskName) {
                showToast('请输入任务名称', 'warning');
                return;
            }
            
            const selectedDate = dateInput.value ? new Date(dateInput.value) : new Date();
            const taskColor = colorContainer ? colorContainer.dataset.selectedColor || '#9C27B0' : '#9C27B0';
            const taskRepeat = repeatSelect.value;
            
            let totalAdded = 0;
            let serverCount = 0;
            let skippedCount = 0;
            
            // 遍历所有大区
            servers.forEach(server => {
                const rolesToAdd = server.roles.filter(role => role !== '全部');
                
                if (rolesToAdd.length === 0) {
                    return;
                }
                
                // 为每个角色创建任务
                rolesToAdd.forEach(role => {
                    // 检查是否已存在相同名称、相同角色、相同重复类型的任务
                    const existingTask = server.tasks.find(t => 
                        t.text === taskName && 
                        t.role === role && 
                        t.repeat === taskRepeat
                    );
                    
                    if (existingTask) {
                        // 如果已存在，跳过
                        skippedCount++;
                        return;
                    }
                    
                    const newTask = {
                        id: `task-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
                        text: taskName,
                        repeat: taskRepeat,
                        role: role,
                        color: taskColor,
                        completed: false,
                        lastCompleted: null,
                        created: new Date().toISOString(),
                        nextDate: selectedDate.toISOString()
                    };
                    server.tasks.push(newTask);
                    totalAdded++;
                });
                
                serverCount++;
            });
            
            saveServers();
            renderTasks();
            updateDate();
            
            hideGlobalAddTask();
            
            // 显示详细结果
            if (skippedCount > 0) {
                showToast(`已为${serverCount}个大区的${totalAdded}个角色添加任务，跳过${skippedCount}个重复任务`, 'info');
            } else {
                showToast(`已为${serverCount}个大区的${totalAdded}个角色添加任务`, 'success');
            }
            
            // 清空输入框
            taskNameInput.value = '';
        }
        
        // 页面加载时初始化
        window.addEventListener('load', function() {
            checkAndResetRecurringTasks();
            renderServers();
            // 确保DOM创建后再渲染任务
            setTimeout(() => {
                renderTasks();
            }, 0);
        });
    </script>
</body>
</html>
