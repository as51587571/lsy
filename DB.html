<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏待办事项列表</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        h1 {
            color: #333;
            text-align: center;
            margin: 5px 0;
            font-size: 20px;
        }
        .global-controls {
            background-color: white;
            border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.1);
            padding: 8px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .servers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 8px;
            flex: 1;
            min-height: 0;
        }
        .server-section {
            background-color: white;
            border-radius: 6px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .server-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .server-title {
            font-size: 14px;
            font-weight: bold;
        }
        .server-controls {
            display: flex;
            gap: 5px;
        }
        .server-content {
            padding: 8px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .task-list {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            align-content: start;
        }
        .task-group {
            grid-column: 1 / -1;
        }
        .task-item:hover {
            background-color: #e8e8e8;
            border-color: #ccc;
        }
        .task-item {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 3px 5px;
            border-radius: 3px;
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            transition: all 0.2s;
            font-size: 11px;
            height: 24px;
        }
        /* 任务分组样式 */
        .task-group {
            margin-bottom: 10px;
            background-color: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 6px;
        }
        .task-group-header {
            font-weight: bold;
            font-size: 12px;
            color: #667eea;
            margin-bottom: 5px;
            padding: 3px 6px;
            background-color: #f0f0ff;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .task-group-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 5px;
        }
        .grouped-task {
            background-color: white;
            border: 1px solid #d0d0d0;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        input[type="checkbox"] {
            transform: scale(0.85);
            margin: 0;
        }
        .task-content {
            flex: 1;
            font-size: 11px;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .task-controls {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }
        .repeat-badge {
            font-size: 11px;
            padding: 2px 5px;
            border-radius: 6px;
            background-color: #e0e0e0;
        }
        .daily {
            background-color: #bbdefb;
            color: #0d47a1;
        }
        .weekly {
            background-color: #c8e6c9;
            color: #1b5e20;
        }
        .add-task {
            display: flex;
            gap: 5px;
            margin-top: 5px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .add-task-row {
            display: contents;
        }
        .add-task-row input[type="text"] {
            flex: 1;
            min-width: 200px;
        }
        input[type="text"], select, input[type="date"], input[type="datetime-local"] {
            padding: 4px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 11px;
        }
        input[type="date"] {
            width: 150px;
            min-width: 150px;
        }
        input[type="datetime-local"] {
            width: 160px;
            min-width: 160px;
        }
        select {
            min-width: 80px;
            max-width: 150px;
            flex: 1;
        }
        /* 角色选择器 */
        .role-selector {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
            margin-bottom: 3px;
        }
        .role-tag {
            padding: 1px 4px;
            border-radius: 8px;
            font-size: 9px;
            cursor: pointer;
            background-color: #e0e0e0;
            color: #666;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .role-tag.active {
            background-color: #667eea;
            color: white;
        }
        .role-tag:hover {
            opacity: 0.8;
        }
        button {
            padding: 2px 5px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
        .sound-control {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 12px;
        }
        .date-info {
            text-align: right;
            color: #666;
            font-size: 10px;
            margin-top: 5px;
        }
        .delete-btn {
            background-color: #f44336;
            padding: 2px 5px;
            font-size: 9px;
        }
        .delete-btn:hover {
            background-color: #d32f2f;
        }
        .data-controls {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 5px;
        }
        .export-btn {
            background-color: #2196F3;
        }
        .export-btn:hover {
            background-color: #1976D2;
        }
        .import-btn {
            background-color: #FF9800;
        }
        .import-btn:hover {
            background-color: #F57C00;
        }
        .clear-btn {
            background-color: #9E9E9E;
        }
        .clear-btn:hover {
            background-color: #757575;
        }
        .add-server-btn {
            background-color: #9C27B0;
        }
        .add-server-btn:hover {
            background-color: #7B1FA2;
        }
        .completed-task {
            text-decoration: line-through;
            color: #999;
        }
        /* 提示信息样式 */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 4px;
            color: white;
            font-size: 13px;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .toast.show {
            opacity: 1;
        }
        .toast.success {
            background-color: #4CAF50;
        }
        .toast.error {
            background-color: #f44336;
        }
        .toast.warning {
            background-color: #FF9800;
        }
        .toast.info {
            background-color: #2196F3;
        }
        /* 声音设置面板 */
        .sound-settings {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 10001;
            min-width: 300px;
        }
        .sound-settings.show {
            display: block;
        }
        .sound-settings-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10000;
        }
        .sound-settings-overlay.show {
            display: block;
        }
        .sound-settings h3 {
            margin: 0 0 15px 0;
            color: #333;
        }
        .sound-settings label {
            display: block;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .sound-settings input[type="range"] {
            width: 100%;
            margin: 5px 0;
        }
        .sound-settings .value-display {
            text-align: right;
            color: #666;
            font-size: 12px;
        }
        .sound-settings button {
            margin-top: 10px;
            width: 100%;
        }
        .close-settings {
            background-color: #9E9E9E;
        }
        /* 输入框弹窗样式 */
        .input-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 10002;
            min-width: 300px;
        }
        .input-modal.show {
            display: block;
        }
        .input-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10001;
        }
        .input-modal-overlay.show {
            display: block;
        }
        .input-modal h3 {
            margin: 0 0 15px 0;
            color: #333;
            font-size: 16px;
        }
        .input-modal input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .input-modal input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .input-modal-buttons button {
            padding: 6px 16px;
        }
        .modal-cancel {
            background-color: #9E9E9E;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>游戏待办事项列表</h1>
        
        <!-- 全局控制区 -->
        <div class="global-controls">
            <div class="sound-control">
                <label>
                    <input type="checkbox" id="sound-toggle" checked>
                    启用声音提示
                </label>
                <button onclick="testSound()">测试声音</button>
                <button onclick="showSoundSettings()">声音设置</button>
            </div>
            
            <div class="data-controls">
                <button class="export-btn" onclick="exportData()">导出</button>
                <button class="import-btn" onclick="document.getElementById('import-file').click()">导入</button>
                <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importData(this)">
                <button class="clear-btn" onclick="clearAllData()">清空</button>
                <button class="add-server-btn" onclick="addNewServer()">+ 添加大区</button>
            </div>
            
            <div class="date-info">
                最后更新: <span id="last-updated"></span>
            </div>
        </div>
        
        <!-- 大区网格布局 -->
        <div class="servers-grid" id="servers-container"></div>
        
        <!-- 声音设置面板 -->
        <div class="sound-settings-overlay" id="sound-overlay" onclick="hideSoundSettings()"></div>
        <div class="sound-settings" id="sound-settings">
            <h3>声音设置</h3>
            
            <label>
                提示音时长（秒）：
                <input type="range" id="sound-duration" min="0.1" max="3" step="0.1" value="0.5" oninput="updateDurationDisplay()">
                <div class="value-display" id="duration-value">0.5秒</div>
            </label>
            
            <label>
                自定义音频文件（可选）：
                <input type="file" id="custom-sound" accept="audio/*" onchange="loadCustomSound(this)">
            </label>
            
            <button onclick="testCustomSound()">测试当前声音</button>
            <button class="close-settings" onclick="hideSoundSettings()">关闭</button>
        </div>
        
        <!-- 通用输入框弹窗 -->
        <div class="input-modal-overlay" id="input-modal-overlay" onclick="closeInputModal()"></div>
        <div class="input-modal" id="input-modal">
            <h3 id="input-modal-title">输入</h3>
            <input type="text" id="input-modal-input" placeholder="请输入...">
            <div class="input-modal-buttons">
                <button class="modal-cancel" onclick="closeInputModal()">取消</button>
                <button id="input-modal-confirm" onclick="confirmInputModal()">确定</button>
            </div>
        </div>
    </div>

    <script>
        // 音频上下文用于播放声音
        let audioContext = null;
        let soundEnabled = true;
        let customAudioBuffer = null; // 自定义音频缓冲区
        let soundDuration = 0.5; // 默认时长0.5秒
        
        // Toast提示函数
        function showToast(message, type = 'info', duration = 2000) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            // 显示动画
            setTimeout(() => toast.classList.add('show'), 10);
            
            // 自动隐藏
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => document.body.removeChild(toast), 300);
            }, duration);
        }
        
        // 初始化音频上下文
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        // 播放提示音
        function playNotificationSound() {
            if (!soundEnabled) return;
            
            initAudio();
            
            // 如果有自定义音频，播放自定义音频
            if (customAudioBuffer) {
                const source = audioContext.createBufferSource();
                source.buffer = customAudioBuffer;
                source.connect(audioContext.destination);
                source.start(0);
            } else {
                // 使用默认的合成声音
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + soundDuration);
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + soundDuration);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + soundDuration);
            }
        }
        
        // 测试声音功能
        function testSound() {
            playNotificationSound();
        }
        
        // 显示声音设置面板
        function showSoundSettings() {
            document.getElementById('sound-settings').classList.add('show');
            document.getElementById('sound-overlay').classList.add('show');
        }
        
        // 隐藏声音设置面板
        function hideSoundSettings() {
            document.getElementById('sound-settings').classList.remove('show');
            document.getElementById('sound-overlay').classList.remove('show');
        }
        
        // 更新时长显示
        function updateDurationDisplay() {
            const durationInput = document.getElementById('sound-duration');
            soundDuration = parseFloat(durationInput.value);
            document.getElementById('duration-value').textContent = soundDuration.toFixed(1) + '秒';
            localStorage.setItem('todoSoundDuration', soundDuration);
        }
        
        // 加载自定义音频文件
        function loadCustomSound(inputElement) {
            const file = inputElement.files[0];
            if (!file) return;
            
            initAudio();
            
            const reader = new FileReader();
            reader.onload = function(e) {
                audioContext.decodeAudioData(e.target.result, function(buffer) {
                    customAudioBuffer = buffer;
                    localStorage.setItem('todoCustomSound', 'true');
                    showToast('自定义音频已加载', 'success');
                }, function(error) {
                    showToast('音频解码失败：' + error.message, 'error');
                });
            };
            reader.readAsArrayBuffer(file);
        }
        
        // 测试自定义声音
        function testCustomSound() {
            playNotificationSound();
        }
        
        // 通用输入框相关函数
        let inputModalCallback = null;
        
        function showInputModal(title, placeholder, callback) {
            document.getElementById('input-modal-title').textContent = title;
            document.getElementById('input-modal-input').placeholder = placeholder;
            document.getElementById('input-modal-input').value = '';
            document.getElementById('input-modal').classList.add('show');
            document.getElementById('input-modal-overlay').classList.add('show');
            inputModalCallback = callback;
            
            // 自动聚焦输入框
            setTimeout(() => {
                document.getElementById('input-modal-input').focus();
            }, 100);
        }
        
        function closeInputModal() {
            document.getElementById('input-modal').classList.remove('show');
            document.getElementById('input-modal-overlay').classList.remove('show');
            inputModalCallback = null;
        }
        
        function confirmInputModal() {
            const value = document.getElementById('input-modal-input').value.trim();
            if (value && inputModalCallback) {
                inputModalCallback(value);
            }
            closeInputModal();
        }
        
        // 回车键确认
        document.addEventListener('DOMContentLoaded', function() {
            const inputModalInput = document.getElementById('input-modal-input');
            if (inputModalInput) {
                inputModalInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        confirmInputModal();
                    }
                });
            }
        });
        
        // 切换声音开关
        document.getElementById('sound-toggle').addEventListener('change', function() {
            soundEnabled = this.checked;
            localStorage.setItem('todoSoundEnabled', soundEnabled);
        });
        
        // 从 localStorage 加载声音设置
        function loadSoundSetting() {
            const savedSetting = localStorage.getItem('todoSoundEnabled');
            if (savedSetting !== null) {
                soundEnabled = savedSetting === 'true';
                document.getElementById('sound-toggle').checked = soundEnabled;
            }
                    
            // 加载时长设置
            const savedDuration = localStorage.getItem('todoSoundDuration');
            if (savedDuration !== null) {
                soundDuration = parseFloat(savedDuration);
                document.getElementById('sound-duration').value = soundDuration;
                document.getElementById('duration-value').textContent = soundDuration.toFixed(1) + '秒';
            }
        }
        
        // 设置当前日期
        function updateDate() {
            document.getElementById('last-updated').textContent = new Date().toLocaleDateString('zh-CN');
        }
        updateDate();
        
        // 加载声音设置
        loadSoundSetting();
        
        // 存储任务的数组
        let servers = JSON.parse(localStorage.getItem('gameTodoServers')) || [
            {
                id: 'server-1',
                name: '默认大区',
                tasks: [],
                collapsed: false,
                roles: ['全部'] // 默认角色列表
            }
        ];
        
        // 数据兼容处理：为旧数据添加roles字段
        servers.forEach(server => {
            if (!server.roles || !Array.isArray(server.roles)) {
                server.roles = ['全部'];
            }
            
            // 为旧任务添加role字段
            server.tasks.forEach(task => {
                if (!task.role) {
                    task.role = '全部';
                }
            });
        });
        
        // 保存更新后的数据结构
        saveServers();
        
        // 当前选中的大区ID
        let currentServerId = servers.length > 0 ? servers[0].id : null;
        
        // 防止重复添加的标志
        let isAddingTask = false;
        
        // 当前选中的角色（每个大区独立）
        let currentRoles = {};
        
        // 渲染所有大区
        function renderServers() {
            const container = document.getElementById('servers-container');
            container.innerHTML = '';
            
            servers.forEach(server => {
                const serverElement = createServerElement(server);
                container.appendChild(serverElement);
            });
        }
        
        // 创建大区元素
        function createServerElement(server) {
            const section = document.createElement('div');
            section.className = 'server-section';
            section.dataset.serverId = server.id;
            
            // 大区头部
            const header = document.createElement('div');
            header.className = 'server-header';
            
            const title = document.createElement('div');
            title.className = 'server-title';
            title.textContent = server.name;
            title.title = '双击编辑名称';
            title.style.cursor = 'pointer';
            
            // 双击编辑大区名称
            title.ondblclick = (e) => {
                e.stopPropagation();
                editServerName(server.id, title);
            };
            
            const controls = document.createElement('div');
            controls.className = 'server-controls';
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = '删除';
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                deleteServer(server.id);
            };
            
            controls.appendChild(deleteBtn);
            
            header.appendChild(title);
            header.appendChild(controls);
            
            // 大区内容
            const content = document.createElement('div');
            content.className = 'server-content';
            
            // 角色选择器
            const roleSelector = document.createElement('div');
            roleSelector.className = 'role-selector';
            roleSelector.id = `roles-${server.id}`;
            
            // 初始化当前选中角色
            if (!currentRoles[server.id]) {
                currentRoles[server.id] = '全部';
            }
            
            // 渲染角色标签
            server.roles.forEach((role, index) => {
                const roleTag = document.createElement('span');
                roleTag.className = 'role-tag';
                if (role === currentRoles[server.id]) {
                    roleTag.classList.add('active');
                }
                roleTag.textContent = role;
                roleTag.title = '双击编辑名称';
                roleTag.style.cursor = 'pointer';
                
                // 单击和双击检测
                let clickTimer = null;
                
                roleTag.addEventListener('click', (e) => {
                    e.stopPropagation();
                    
                    if (clickTimer) {
                        // 双击
                        clearTimeout(clickTimer);
                        clickTimer = null;
                        
                        // 编辑角色名称（除了“全部”）
                        if (role !== '全部') {
                            editRoleName(server.id, index, roleTag);
                        }
                    } else {
                        // 单击 - 延迟执行以检测是否为双击
                        clickTimer = setTimeout(() => {
                            clickTimer = null;
                            selectRole(server.id, role);
                        }, 250);
                    }
                });
                
                roleSelector.appendChild(roleTag);
            });
            
            // 添加角色按钮
            const addRoleBtn = document.createElement('button');
            addRoleBtn.textContent = '+';
            addRoleBtn.style.padding = '1px 4px';
            addRoleBtn.style.fontSize = '9px';
            addRoleBtn.onclick = (e) => {
                e.stopPropagation();
                addRole(server.id);
            };
            roleSelector.appendChild(addRoleBtn);
            
            // 删除角色按钮（至少保留"全部"）

                deleteRoleBtn.textContent = '-';
                deleteRoleBtn.style.padding = '1px 4px';
                deleteRoleBtn.style.fontSize = '9px';
                deleteRoleBtn.style.backgroundColor = '#f44336';
                deleteRoleBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteRole(server.id);
                };
                roleSelector.appendChild(deleteRoleBtn);
            }
            
            content.appendChild(roleSelector);
            
            // 任务列表区域（直接作为网格容器）
            const taskList = document.createElement('div');
            taskList.className = 'task-list';
            taskList.id = `list-${server.id}`;
            
            content.appendChild(taskList);
            
            // 添加任务区域
            const addTaskDiv = document.createElement('div');
            addTaskDiv.className = 'add-task';
            
            // 第一行：任务输入框
            const row1 = document.createElement('div');
            row1.className = 'add-task-row';
            
            const taskInput = document.createElement('input');
            taskInput.type = 'text';
            taskInput.placeholder = '输入任务...';
            taskInput.id = `input-${server.id}`;
            taskInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    addTaskToServer(server.id);
                }
            });
            
            row1.appendChild(taskInput);
            addTaskDiv.appendChild(row1);
            
            // 第二行：日期、重复、角色、添加按钮
            const row2 = document.createElement('div');
            row2.className = 'add-task-row';
            
            const dateInput = document.createElement('input');
            dateInput.type = 'datetime-local';
            dateInput.id = `date-${server.id}`;
            // 默认设置为当前时间
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            dateInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
            
            const repeatSelect = document.createElement('select');
            repeatSelect.id = `repeat-${server.id}`;
            repeatSelect.innerHTML = `
                <option value="none">一次性</option>
                <option value="daily">每日</option>
                <option value="weekly-1">每周一</option>
                <option value="weekly-2">每周二</option>
                <option value="weekly-3">每周三</option>
                <option value="weekly-4">每周四</option>
                <option value="weekly-5">每周五</option>
                <option value="weekly-6">每周六</option>
                <option value="weekly-0">每周日</option>
            `;
            
            // 角色选择下拉框
            const roleSelect = document.createElement('select');
            roleSelect.id = `role-${server.id}`;
            
            // 添加"全部角色"选项
            const allOption = document.createElement('option');
            allOption.value = '__all__';
            allOption.textContent = '全部角色';
            roleSelect.appendChild(allOption);
            
            server.roles.forEach(role => {
                const option = document.createElement('option');
                option.value = role;
                option.textContent = role;
                if (role === currentRoles[server.id]) {
                    option.selected = true;
                }
                roleSelect.appendChild(option);
            });
            
            const addBtn = document.createElement('button');
            addBtn.textContent = '添加';
            addBtn.onclick = () => addTaskToServer(server.id);
            addBtn.style.whiteSpace = 'nowrap';
            
            row2.appendChild(dateInput);
            row2.appendChild(repeatSelect);
            row2.appendChild(roleSelect);
            row2.appendChild(addBtn);
            addTaskDiv.appendChild(row2);
            
            content.appendChild(addTaskDiv);
            
            section.appendChild(header);
            section.appendChild(content);
            
            return section;

        // 切换大区折叠状态（已移除）
        // function toggleServerCollapse(serverId) { ... }
        
        // 选择角色
        function selectRole(serverId, role) {
            currentRoles[serverId] = role;
            renderServers();
            renderTasks();
        }
        
        // 编辑角色名称
        function editRoleName(serverId, roleIndex, roleTag) {
            const server = servers.find(s => s.id === serverId);
            if (!server || roleIndex === 0) {
                console.log('不能编辑全部角色');
                return; // 不能编辑“全部”
            }
            
            console.log('开始编辑角色:', server.roles[roleIndex]);
            
            const oldName = server.roles[roleIndex];
            
            // 将标签转换为输入框
            const input = document.createElement('input');
            input.type = 'text';
            input.value = oldName;
            input.className = 'role-tag';
            input.style.cssText = `
                border: 1px solid #667eea;
                border-radius: 10px;
                padding: 2px 6px;
                font-size: 10px;
                width: 80px;
                outline: none;
                background-color: white;
                color: #333;
            `;
            
            roleTag.replaceWith(input);
            
            // 延迟聚焦确保DOM已更新
            setTimeout(() => {
                input.focus();
                input.select();
            }, 10);
            
            // 保存新名称
            const saveName = () => {
                const newName = input.value.trim();
                console.log('保存角色名称:', newName);
                
                if (newName && newName !== oldName) {
                    // 更新所有使用该角色的任务
                    server.tasks.forEach(task => {
                        if (task.role === oldName) {
                            task.role = newName;
                        }
                    });
                    
                    server.roles[roleIndex] = newName;
                    saveServers();
                    showToast('角色名称已更新', 'success');
                } else if (!newName) {
                    showToast('角色名称不能为空', 'warning');
                }
                renderServers();
                renderTasks();
            };
            
            // 失焦或回车时保存
            input.addEventListener('blur', saveName);
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    input.blur();
                }
            });
            
            // ESC取消
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    input.value = oldName;
                    input.blur();
                }
            });
        }
        
        // 编辑大区名称
        function editServerName(serverId, titleElement) {
            const server = servers.find(s => s.id === serverId);
            if (!server) return;
            
            const oldName = server.name;
            
            // 将标题转换为输入框
            const input = document.createElement('input');
            input.type = 'text';
            input.value = oldName;
            input.style.cssText = `
                background: transparent;
                border: 1px solid white;
                border-radius: 3px;
                padding: 2px 5px;
                font-size: 14px;
                font-weight: bold;
                color: white;
                width: 150px;
                outline: none;
            `;
            
            titleElement.replaceWith(input);
            input.focus();
            input.select();
            
            // 保存新名称
            const saveName = () => {
                const newName = input.value.trim();
                if (newName && newName !== oldName) {
                    server.name = newName;
                    saveServers();
                    showToast('大区名称已更新', 'success');
                }
                renderServers();
            };
            
            // 失焦或回车时保存
            input.addEventListener('blur', saveName);
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    input.blur();
                }
            });
        }
        
        // 添加角色
        function addRole(serverId) {
            const server = servers.find(s => s.id === serverId);
            if (server) {
                // 创建默认名称的角色
                const defaultName = `角色${server.roles.length}`;
                server.roles.push(defaultName);
                saveServers();
                renderServers();
                showToast('新角色已创建，双击角色名称可编辑', 'info');
            }
        }
                
        // 删除角色
        function deleteRole(serverId) {
            const server = servers.find(s => s.id === serverId);
            if (!server || server.roles.length <= 1) {
                showToast('至少需要保留一个角色', 'warning');
                return;
            }
                    
            // 删除最后一个角色（除了"全部"）
            const removedRole = server.roles.pop();
                    
            // 删除该角色下的所有任务
            server.tasks = server.tasks.filter(task => task.role !== removedRole);
                    
            // 如果当前选中的是被删除的角色，切换到"全部"
            if (currentRoles[serverId] === removedRole) {
                currentRoles[serverId] = '全部';
            }
                    
            saveServers();
            renderServers();
            renderTasks();
            showToast(`角色 "${removedRole}" 及其任务已删除`, 'info');
        }
        
        // 添加新大区
        function addNewServer() {
            if (servers.length >= 4) {
                showToast('最多只能创建4个大区！', 'warning');
                return;
            }
            
            // 创建默认名称的大区
            const defaultName = `新区${servers.length + 1}`;
            const newServer = {
                id: `server-${Date.now()}`,
                name: defaultName,
                tasks: [],
                collapsed: false,
                roles: ['全部']
            };
            servers.push(newServer);
            saveServers();
            renderServers();
            showToast('新大区已创建，双击大区名称可编辑', 'info');
        }
        
        // 删除大区
        function deleteServer(serverId) {
            if (servers.length <= 1) {
                showToast('至少需要保留一个大区！', 'warning');
                return;
            }
            
            const server = servers.find(s => s.id === serverId);
            if (!server) return;
            
            const index = servers.findIndex(s => s.id === serverId);
            if (index !== -1) {
                servers.splice(index, 1);
                saveServers();
                renderServers();
                showToast(`大区 "${server.name}" 已删除`, 'info');
            }
        }
        
        // 向指定大区添加任务
        function addTaskToServer(serverId) {
            // 防止重复添加
            if (isAddingTask) {
                console.log('正在添加中，忽略本次请求');
                return;
            }
            isAddingTask = true;
            
            const taskInput = document.getElementById(`input-${serverId}`);
            const dateInput = document.getElementById(`date-${serverId}`);
            const repeatSelect = document.getElementById(`repeat-${serverId}`);
            const roleSelect = document.getElementById(`role-${serverId}`);
            const taskText = taskInput.value.trim();
            
            console.log('添加任务:', taskText, '大区ID:', serverId);
            
            if (taskText) {
                const server = servers.find(s => s.id === serverId);
                if (server) {
                    console.log('当前任务数量:', server.tasks.length);
                    
                    // 从日期输入框获取日期
                    const selectedDate = dateInput.value ? new Date(dateInput.value) : new Date();
                    
                    // 检查是否选择"全部角色"
                    const selectedRole = roleSelect.value;
                    
                    if (selectedRole === '__all__') {
                        // 为每个角色创建任务副本（除了"全部"）
                        const rolesToAdd = server.roles.filter(role => role !== '全部');
                        
                        if (rolesToAdd.length === 0) {
                            showToast('没有可添加的角色', 'warning');
                            isAddingTask = false;
                            return;
                        }
                        
                        let addedCount = 0;
                        rolesToAdd.forEach(role => {
                            const newTask = {
                                id: `task-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
                                text: taskText,
                                repeat: repeatSelect.value,
                                role: role,
                                completed: false,
                                lastCompleted: null,
                                created: new Date().toISOString(),
                                nextDate: selectedDate.toISOString()
                            };
                            server.tasks.push(newTask);
                            addedCount++;
                        });
                        
                        console.log(`已为${addedCount}个角色添加任务`);
                        showToast(`已为${addedCount}个角色添加任务`, 'success');
                    } else {
                        // 为单个角色添加任务
                        const newTask = {
                            id: `task-${Date.now()}`,
                            text: taskText,
                            repeat: repeatSelect.value,
                            role: selectedRole,
                            completed: false,
                            lastCompleted: null,
                            created: new Date().toISOString(),
                            nextDate: selectedDate.toISOString()
                        };
                        
                        server.tasks.push(newTask);
                        console.log('添加后任务数量:', server.tasks.length);
                        showToast('任务已添加', 'success');
                    }
                    
                    saveServers();
                    renderTasks();
                    
                    // 清空输入框并失焦
                    taskInput.value = '';
                    taskInput.blur();
                    
                    // 更新日期选择器为当前时间
                    const now = new Date();
                    const year = now.getFullYear();
                    const month = String(now.getMonth() + 1).padStart(2, '0');
                    const day = String(now.getDate()).padStart(2, '0');
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    dateInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
                    
                    // 更新最后更新时间
                    updateDate();
                }
            }
            
            // 重置标志，允许下次添加
            setTimeout(() => {
                isAddingTask = false;
                console.log('添加标志已重置');
            }, 300);
        }
        
        // 切换任务完成状态
        function toggleTaskCompletion(serverId, taskId) {
            const server = servers.find(s => s.id === serverId);
            if (!server) return;
            
            const task = server.tasks.find(t => t.id === taskId);
            if (!task) return;
            
            const today = new Date().toDateString();
            
            if (task.completed && task.lastCompleted === today) {
                task.completed = false;
                task.lastCompleted = null;
            } else {
                task.completed = true;
                task.lastCompleted = today;
                
                // 更新下次完成日期
                if (task.repeat === 'daily') {
                    const tomorrow = new Date();
                    tomorrow.setDate(tomorrow.getDate() + 1);
                    task.nextDate = tomorrow.toISOString();
                } else if (task.repeat && task.repeat.startsWith('weekly-')) {
                    // 自定义每周重置日
                    const resetDay = parseInt(task.repeat.split('-')[1]);
                    const nextReset = new Date();
                    const currentDay = nextReset.getDay();
                    
                    // 计算距离下一个重置日还有几天
                    let daysUntilReset = (resetDay - currentDay + 7) % 7;
                    if (daysUntilReset === 0) {
                        daysUntilReset = 7; // 如果是同一天，就设置为7天后
                    }
                    
                    nextReset.setDate(nextReset.getDate() + daysUntilReset);
                    task.nextDate = nextReset.toISOString();
                } else if (task.repeat === 'none') {
                    // 一次性任务完成后自动删除
                    const taskIndex = server.tasks.findIndex(t => t.id === taskId);
                    if (taskIndex !== -1) {
                        server.tasks.splice(taskIndex, 1);
                        showToast('任务已完成并删除', 'info');
                        saveServers();
                        renderTasks();
                        updateDate();
                        return;
                    }
                }
            }
            
            saveServers();
            renderTasks();
            updateDate();
        }
        
        // 更新任务文本
        function updateTaskText(serverId, taskId, newText) {
            const server = servers.find(s => s.id === serverId);
            if (!server) return;
            
            const task = server.tasks.find(t => t.id === taskId);
            if (task) {
                task.text = newText.trim();
                saveServers();
            }
        }
        
        // 删除任务
        function deleteTask(serverId, taskId) {
            const server = servers.find(s => s.id === serverId);
            if (!server) return;
            
            const task = server.tasks.find(t => t.id === taskId);
            if (!task) return;
            
            console.log('删除前任务数量:', server.tasks.length);
            const index = server.tasks.findIndex(t => t.id === taskId);
            if (index !== -1) {
                server.tasks.splice(index, 1);
                console.log('删除后任务数量:', server.tasks.length);
                saveServers();
                renderTasks();
                updateDate();
                showToast('任务已删除', 'info');
            }
        }
        
        // 删除整个任务分组（所有角色的同名任务）
        function deleteTaskGroup(serverId, taskName) {
            const server = servers.find(s => s.id === serverId);
            if (!server) return;
            
            // 过滤掉所有匹配任务名的任务
            const beforeCount = server.tasks.length;
            server.tasks = server.tasks.filter(task => task.text !== taskName);
            const afterCount = server.tasks.length;
            const deletedCount = beforeCount - afterCount;
            
            if (deletedCount > 0) {
                saveServers();
                renderTasks();
                updateDate();
                showToast(`已删除${deletedCount}个“${taskName}”任务`, 'info');
            }
        }
        
        // 渲染任务列表
        function renderTasks() {
            servers.forEach(server => {
                const listElement = document.getElementById(`list-${server.id}`);
                if (!listElement) return;
                
                listElement.innerHTML = '';
                
                // 根据当前选中的角色过滤任务
                const selectedRole = currentRoles[server.id] || '全部';
                let filteredTasks = selectedRole === '全部' 
                    ? server.tasks 
                    : server.tasks.filter(task => task.role === selectedRole);
                
                // 按任务名分组
                const taskGroups = {};
                filteredTasks.forEach(task => {
                    if (!taskGroups[task.text]) {
                        taskGroups[task.text] = [];
                    }
                    taskGroups[task.text].push(task);
                });
                
                // 渲染每个任务组
                Object.keys(taskGroups).forEach(taskName => {
                    const group = taskGroups[taskName];
                    
                    // 如果组内没有任务，跳过（自动删除空分组）
                    if (group.length === 0) {
                        return;
                    }
                    
                    // 如果组内有多个任务（批量添加的），创建组容器
                    if (group.length > 1) {
                        const groupContainer = document.createElement('div');
                        groupContainer.className = 'task-group';
                        
                        // 组标题（带删除按钮）
                        const groupHeader = document.createElement('div');
                        groupHeader.className = 'task-group-header';
                        
                        const headerText = document.createElement('span');
                        headerText.textContent = taskName;
                        headerText.style.flex = '1';
                        
                        const deleteGroupBtn = document.createElement('button');
                        deleteGroupBtn.textContent = '删除全部';
                        deleteGroupBtn.style.cssText = `
                            padding: 2px 8px;
                            font-size: 10px;
                            background-color: #f44336;
                            color: white;
                            border: none;
                            border-radius: 3px;
                            cursor: pointer;
                            margin-left: 10px;
                        `;
                        deleteGroupBtn.onclick = (e) => {
                            e.stopPropagation();
                            deleteTaskGroup(server.id, taskName);
                        };
                        
                        groupHeader.appendChild(headerText);
                        groupHeader.appendChild(deleteGroupBtn);
                        groupContainer.appendChild(groupHeader);
                        
                        // 任务网格
                        const groupGrid = document.createElement('div');
                        groupGrid.className = 'task-group-grid';
                        
                        group.forEach(task => {
                            const taskElement = createTaskElement(server.id, task);
                            taskElement.classList.add('grouped-task');
                            groupGrid.appendChild(taskElement);
                        });
                        
                        groupContainer.appendChild(groupGrid);
                        listElement.appendChild(groupContainer);
                    } else {
                        // 单个任务直接添加
                        const taskElement = createTaskElement(server.id, group[0]);
                        listElement.appendChild(taskElement);
                    }
                });
            });
        }
        
        // 创建任务元素
        function createTaskElement(serverId, task) {
            const div = document.createElement('div');
            div.className = 'task-item';
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = task.completed && task.lastCompleted === new Date().toDateString();
            checkbox.addEventListener('change', () => toggleTaskCompletion(serverId, task.id));
            
            const span = document.createElement('span');
            span.className = 'task-content';
            if (task.completed && task.lastCompleted === new Date().toDateString()) {
                span.classList.add('completed-task');
            }
            span.textContent = task.text;
            span.contentEditable = true;
            span.addEventListener('blur', () => updateTaskText(serverId, task.id, span.textContent));
            span.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    span.blur();
                }
            });
            
            const controls = document.createElement('div');
            controls.className = 'task-controls';
            
            // 角色标签（如果不是“全部”）
            if (task.role && task.role !== '全部') {
                const roleBadge = document.createElement('span');
                roleBadge.className = 'repeat-badge';
                roleBadge.style.backgroundColor = '#e1bee7';
                roleBadge.style.color = '#6a1b9a';
                roleBadge.textContent = task.role;
                controls.appendChild(roleBadge);
            }
            
            // 日期显示
            const dateBadge = document.createElement('span');
            dateBadge.className = 'repeat-badge';
            dateBadge.style.backgroundColor = '#fff9c4';
            dateBadge.style.color = '#f57f17';
            
            const nextDate = new Date(task.nextDate);
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            if (task.repeat === 'daily') {
                dateBadge.textContent = '每日';
            } else if (task.repeat && task.repeat.startsWith('weekly-')) {
                // 显示自定义的每周重置日
                const dayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                const resetDay = parseInt(task.repeat.split('-')[1]);
                dateBadge.textContent = '每' + dayNames[resetDay];
            } else {
                // 一次性任务，显示具体日期和时间
                const month = nextDate.getMonth() + 1;
                const day = nextDate.getDate();
                const hours = String(nextDate.getHours()).padStart(2, '0');
                const minutes = String(nextDate.getMinutes()).padStart(2, '0');
                dateBadge.textContent = `${month}/${day} ${hours}:${minutes}`;
                
                // 如果是一次性任务且已过期，显示红色
                if (nextDate < today && !task.completed) {
                    dateBadge.style.backgroundColor = '#ffcdd2';
                    dateBadge.style.color = '#c62828';
                }
            }
            controls.appendChild(dateBadge);
            
            // 删除按钮
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = '×';
            deleteBtn.addEventListener('click', () => deleteTask(serverId, task.id));
            controls.appendChild(deleteBtn);
            
            div.appendChild(checkbox);
            div.appendChild(span);
            div.appendChild(controls);
            
            return div;
        }
        
        // 保存大区数据到localStorage
        function saveServers() {
            localStorage.setItem('gameTodoServers', JSON.stringify(servers));
        }
        
        // 导出数据功能
        function exportData() {
            const data = {
                servers: servers,
                soundEnabled: soundEnabled,
                soundDuration: soundDuration,
                exportDate: new Date().toISOString(),
                version: '2.0'
            };
            
            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `game-todo-backup-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            showToast('数据已成功导出！', 'success');
        }
        
        // 导入数据功能
        function importData(inputElement) {
            const file = inputElement.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    // 验证数据格式
                    if (!importedData.servers || !Array.isArray(importedData.servers)) {
                        throw new Error('无效的数据格式');
                    }
                    
                    servers = importedData.servers;
                    
                    // 导入声音设置（如果存在）
                    if (importedData.soundEnabled !== undefined) {
                        soundEnabled = importedData.soundEnabled;
                        document.getElementById('sound-toggle').checked = soundEnabled;
                        localStorage.setItem('todoSoundEnabled', soundEnabled);
                    }
                    
                    // 导入声音时长设置（如果存在）
                    if (importedData.soundDuration !== undefined) {
                        soundDuration = importedData.soundDuration;
                        document.getElementById('sound-duration').value = soundDuration;
                        document.getElementById('duration-value').textContent = soundDuration.toFixed(1) + '秒';
                        localStorage.setItem('todoSoundDuration', soundDuration);
                    }
                    
                    saveServers();
                    renderServers();
                    updateDate();
                    
                    showToast('数据导入成功！', 'success');
                } catch (error) {
                    showToast('导入失败：' + error.message, 'error');
                }
            };
            reader.readAsText(file);
            
            // 重置文件输入框，以便可以重复导入同一文件
            inputElement.value = '';
        }
        
        // 清空所有数据功能
        function clearAllData() {
            servers = [
                {
                    id: 'server-1',
                    name: '默认大区',
                    tasks: [],
                    collapsed: false,
                    roles: ['全部']
                }
            ];
            currentRoles = {};
            saveServers();
            renderServers();
            updateDate();
            showToast('所有数据已清空！', 'info');
        }
        
        // 检查重复任务并重置（每天执行）
        function checkAndResetRecurringTasks() {
            const today = new Date().toDateString();
            const todayDay = new Date().getDay(); // 今天是星期几
            const lastCheck = localStorage.getItem('lastRecurringCheck');
            
            // 如果上次检查不是今天，则重置重复任务
            if (lastCheck !== today) {
                let changed = false;
                
                servers.forEach(server => {
                    server.tasks.forEach(task => {
                        if (task.repeat !== 'none' && task.completed) {
                            // 对于每日重复任务，每天都重置
                            if (task.repeat === 'daily') {
                                task.completed = false;
                                task.lastCompleted = null;
                                // 更新下次日期为明天
                                const tomorrow = new Date();
                                tomorrow.setDate(tomorrow.getDate() + 1);
                                task.nextDate = tomorrow.toISOString();
                                changed = true;
                            }
                            // 对于自定义每周重复任务，检查今天是否是重置日
                            else if (task.repeat && task.repeat.startsWith('weekly-')) {
                                const resetDay = parseInt(task.repeat.split('-')[1]);
                                
                                // 如果今天是重置日，则重置任务
                                if (todayDay === resetDay) {
                                    task.completed = false;
                                    task.lastCompleted = null;
                                    // 更新下次日期为下周的同一天
                                    const nextWeek = new Date();
                                    nextWeek.setDate(nextWeek.getDate() + 7);
                                    task.nextDate = nextWeek.toISOString();
                                    changed = true;
                                }
                            }
                        }
                    });
                });
                
                if (changed) {
                    saveServers();
                    // 不在这里调用 renderTasks()，等 DOM 创建后再统一渲染
                }
                
                // 更新最后检查日期
                localStorage.setItem('lastRecurringCheck', today);
            }
        }
        
        // 页面加载时初始化
        window.addEventListener('load', function() {
            checkAndResetRecurringTasks();
            renderServers();
            // 确保DOM创建后再渲染任务
            setTimeout(() => {
                renderTasks();
            }, 0);
        });
    </script>
</body>
</html>
