<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同步控制面板</title>
<style>
:root { --bg:#0f0f1a; --panel:#1a1a2e; --border:#2a2a4a; --text:#e0e0e0; --text-secondary:#9999bb; --accent:#4ecdc4; --gold:#f0c060; --red:#ff6b6b; --green:#3fb950; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI','Microsoft YaHei',sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
.container { max-width:420px; width:100%; display:flex; flex-direction:column; gap:14px; }
h2 { text-align:center; font-size:18px; color:var(--accent); }
.panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; }
.status-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.status-dot { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; }
.status-dot.active { background:var(--green); box-shadow:0 0 6px var(--green); }
.status-dot.inactive { background:var(--text-secondary); }
.btn { display:block; width:100%; padding:10px; border:none; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; text-align:center; transition:opacity 0.2s; margin-bottom:8px; }
.btn:hover { opacity:0.85; }
.btn-sync { background:var(--accent); color:#000; }
.btn-bat { background:transparent; border:1px solid var(--border); color:var(--text-secondary); font-weight:400; font-size:12px; }
.log { background:rgba(0,0,0,0.3); border-radius:6px; padding:10px 12px; font-size:11px; color:var(--text-secondary); max-height:150px; overflow-y:auto; font-family:'Consolas','Courier New',monospace; line-height:1.6; }
.log .success { color:var(--green); }
.log .error { color:var(--red); }
.log .info { color:var(--accent); }
.countdown { font-size:28px; font-weight:700; color:var(--accent); text-align:center; margin:8px 0; }
.info-row { display:flex; justify-content:space-between; font-size:12px; color:var(--text-secondary); margin-bottom:6px; }
.info-row span:last-child { color:var(--text); }
.section-title { font-size:12px; color:var(--text-secondary); margin-bottom:8px; }
</style>
</head>
<body>
<div class="container">
  
<div id="protocolWarn" style="background:#3a2020;border:1px solid #ff6b6b;border-radius:8px;padding:12px;margin-bottom:10px;text-align:center;font-size:13px;display:none">
  <span style="color:#ff6b6b">&#9888; 未检测到 syncrun 协议</span><br>
  <span style="color:#9999bb;font-size:11px">新设备需<a href="#" onclick="installProtocol()" style="color:#4ecdc4;text-decoration:underline">点此安装</a>协议后才能使用同步按钮</span>
</div><h2>同步控制面板</h2>
  <div class="panel">
    <div class="status-row">
      <div><span class="status-dot active" id="statusDot"></span><span style="font-size:14px;font-weight:600">自动同步</span></div>
      <span style="font-size:12px;color:var(--text-secondary)">每30分钟</span>
    </div>
    <div class="countdown" id="countdown">--:--</div>
    <div style="text-align:center;font-size:11px;color:var(--text-secondary);margin-bottom:10px">距离下次自动同步</div>
    <div class="info-row"><span>上次同步</span><span id="lastSync">--</span></div>
    <div class="info-row"><span>下次同步</span><span id="nextSync">--</span></div>
    <div class="info-row"><span>仓库</span><span>\\阿林\协作\仓库\lsy</span></div>
  </div>
  <div class="panel">
    <button class="btn btn-sync" onclick="manualSync()">立即同步（全部）</button>
  </div>
  <div class="panel">
    <div class="section-title">快速打开同步脚本</div>
    <div id="batList" style="display:grid;grid-template-columns:1fr 1fr;gap:6px"></div>
  </div>
  <div class="panel">
    <div class="section-title">运行日志</div>
    <div class="log" id="log"><div class="info">[启动] 控制面板已就绪</div></div>
  </div>
</div>
<script>
var INTERVAL = 30;
var SELF = decodeURIComponent(document.location.href).replace(/^file:\/\/\//,'').replace(/\//g,'\\');
var DIR = SELF.substring(0, SELF.lastIndexOf('\\'));
var REPO = DIR;
function pad(n){return n.toString().padStart(2,'0');}
function addLog(m,t){
  var l=document.getElementById('log');
  var d=new Date();
  l.innerHTML+='<div class="'+t+'">['+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+'] '+m+'</div>';
  l.scrollTop=l.scrollHeight;
}
function updateCountdown(){
  var d=new Date();
  var r=(d.getHours()*60+d.getMinutes())%INTERVAL;
  var s=(INTERVAL-r)*60-d.getSeconds();
  document.getElementById('countdown').textContent=pad(Math.floor(s/60))+':'+pad(s%60);
  var n=new Date(d.getTime()+s*1000);
  document.getElementById('nextSync').textContent=pad(n.getHours())+':'+pad(n.getMinutes());
}
function manualSync(){
  addLog('正在同步...','info');
  window.location.href='syncrun:同步到GitHub.bat';
}
function runBat(name){
  window.location.href='syncrun:'+name;
  addLog('已打开: '+name,'info');
}
var bats=['同步到GitHub.bat','同步单个文件.bat','同步bl.html.bat','同步DB.html.bat','同步fuzhiyejisuan.html.bat','同步index.html.bat','同步js.HTML.bat','同步moshi.html.bat','同步nengliang.HTML.bat','同步yxb.html.bat'];
var list=document.getElementById('batList');
for(var i=0;i<bats.length;i++){
  (function(n){
    var btn=document.createElement('button');
    btn.className='btn btn-bat';
    btn.textContent=n.replace('同步','').replace('.bat','');
    btn.style.marginBottom='0';btn.style.padding='8px';
    btn.onclick=function(){runBat(n);};
    list.appendChild(btn);
  })(bats[i]);
}
updateCountdown();
setInterval(updateCountdown,1000);
document.getElementById('lastSync').textContent=pad(new Date().getHours())+':'+pad(new Date().getMinutes())+' (面板启动)';

function checkProtocol(){
  try{
    var w = window.open('syncrun:__ping__','_blank','width=1,height=1');
    if(w){ w.close(); return true; }
    return false;
  }catch(e){ return false; }
}
function installProtocol(){
  window.location.href = 'syncrun:__ping__';
  setTimeout(function(){
    if(!checkProtocol()){
      alert('请双击仓库目录中的「安装syncrun协议.bat」以完成安装，安装后刷新本页面。');
    }
  }, 500);
}
setTimeout(function(){
  if(!checkProtocol()){
    document.getElementById('protocolWarn').style.display='block';
  }
}, 1000);</script>
</body>
</html>
